<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestro menú</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo:#FDFAF6; --tarjeta:#FFFFFF; --tinta:#453D42; --gris:#7C7278; --borde:#F1EAE4; --suave:#F5EFE9;
    --sombra:rgba(74,65,71,.05);
    --durazno:#FFDCC6; --durazno-t:#7A4B31; --durazno-s:#F7C4A4;
    --menta:#D3EDE2; --menta-t:#3B6B58; --menta-s:#AEDCC8;
    --lavanda:#E6E0F8; --lavanda-t:#564688; --lavanda-s:#CFC4EE;
    --limon:#FFEFC9; --limon-t:#7A6128; --limon-s:#F6DFA0;
    --coral:#FCD5D1; --coral-t:#96473F; --coral-s:#F5BAB3;
    --cielo:#D8ECF4; --cielo-t:#376376; --cielo-s:#B5DAE8;
    --arena:#F2E8D9; --arena-t:#75603E; --arena-s:#E3D2B8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fondo:#241E22; --tarjeta:#312A30; --tinta:#F4EAEE; --gris:#AC9CA4; --borde:#443A41;
      --suave:#3B3339; --sombra:rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--fondo); color: var(--tinta);
    font-family: 'Nunito', system-ui, sans-serif; font-size: 17px; line-height: 1.5;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  input, textarea { -webkit-user-select: text; user-select: text; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; min-height: 44px; }
  input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--lavanda-s); outline-offset: 2px; }

  header { max-width: 640px; margin: 0 auto; padding: calc(20px + env(safe-area-inset-top)) 20px 6px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  header h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 30px; margin: 0; line-height: 1; }
  header .fecha { font-size: 13px; color: var(--gris); font-weight: 600; margin-top: 4px; }
  .ico { flex: none; width: 44px; height: 44px; border-radius: 14px; background: var(--tarjeta); box-shadow: 0 2px 8px var(--sombra); font-size: 12px; font-weight: 800; color: var(--gris); }

  main { max-width: 640px; margin: 0 auto; padding: 8px 20px 0; }
  .oculto { display: none !important; }

  .tarjeta { background: var(--tarjeta); border-radius: 24px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px var(--sombra); }
  .tarjeta h2 { font-size: 15px; font-weight: 800; margin: 0 0 4px; letter-spacing: .01em; }
  .tarjeta .desc { font-size: 12.5px; color: var(--gris); margin: 0 0 14px; line-height: 1.5; }
  .cinta { display: inline-block; background: var(--durazno); color: var(--durazno-t); font-family: 'Caveat', cursive; font-weight: 700; font-size: 23px; line-height: 1; padding: 8px 18px 7px; border-radius: 8px; transform: rotate(-1.2deg); margin-bottom: 14px; }
  .dia.hoy .cinta { background: var(--menta); color: var(--menta-t); }

  .hueco { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 0; }
  .hueco + .hueco { border-top: 1px solid var(--borde); }
  .pastilla { flex: none; width: 74px; text-align: left; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--gris); }
  .p-desayuno, .p-comida, .p-cena { color: var(--gris); }
  .hueco.destino .pastilla { color: var(--durazno-t); }
  .nombre-plato { flex: 1; font-size: 16.5px; font-weight: 700; line-height: 1.3; }
  .nombre-plato.vacio { font-weight: 600; color: var(--gris); }
  .mini { flex: none; font-size: 10px; font-weight: 800; border-radius: 6px; padding: 3px 7px; background: var(--limon); color: var(--limon-t); }
  .mini.gris { background: var(--borde); color: var(--gris); }
  .mini.verde { background: var(--menta); color: var(--menta-t); }
  .avatar { flex: none; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 800; line-height: 28px; text-align: center; background: var(--lavanda); color: var(--lavanda-t); }
  .avatar.b { background: var(--coral); color: var(--coral-t); }
  .flecha { color: var(--gris); font-size: 16px; font-weight: 700; }

  .chip.mas { background: transparent; box-shadow: inset 0 0 0 2px var(--borde); color: var(--gris); }
  nav button { position: relative; }
  nav button.con-punto::after { content: ''; position: absolute; top: 6px; right: 50%; margin-right: -16px; width: 8px; height: 8px; border-radius: 50%; background: var(--durazno-s); }
  .vacio-hoy .nombre-plato { font-weight: 600; }
  .fila-aj { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--tarjeta); border-radius: 18px; padding: 14px 16px; margin-bottom: 8px; box-shadow: 0 2px 8px var(--sombra); }
  .fila-aj > span:first-child { flex: 1; }
  .solo-aqui { font-style: normal; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); background: var(--suave); padding: 2px 6px; border-radius: 6px; margin-left: 4px; }
  .fila-aj b { display: block; font-size: 15px; font-weight: 800; margin-bottom: 2px; }
  .fila-aj span span { font-size: 12.5px; color: var(--gris); line-height: 1.45; font-weight: 600; }
  .cab-lista { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sitio { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; margin: 0; letter-spacing: 0; }
  .cuenta { background: var(--borde); color: var(--gris); font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 20px; }
  .casilla-c { flex: none; width: 26px; height: 26px; min-height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--borde); }
  .casilla-c:active { background: var(--menta); }
  .extra-plato { display: flex; align-items: baseline; gap: 8px; padding: 0 0 10px 74px; font-size: 14px; }
  .extra-plato span { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); }
  .extra-plato b { font-weight: 700; }
  .fila-sensacion { display: flex; align-items: center; gap: 6px; padding: 0 0 10px 74px; }
  .fila-sensacion .quien { font-size: 12px; font-weight: 700; color: var(--gris); flex: 1; }
  .mini-sens { min-height: 44px; padding: 6px 12px; border-radius: 12px; font-size: 13px; font-weight: 700; color: var(--gris); box-shadow: inset 0 0 0 2px var(--borde); }
  .mini-sens.sel-bien { background: var(--menta); color: var(--menta-t); box-shadow: none; }
  .mini-sens.sel-regular { background: var(--limon); color: var(--limon-t); box-shadow: none; }
  .mini-sens.sel-mal { background: var(--coral); color: var(--coral-t); box-shadow: none; }
  .btn { display: block; width: 100%; padding: 16px; text-align: center; border-radius: 18px; font-weight: 800; font-size: 16px; margin-bottom: 12px; }
  .btn-1 { background: var(--durazno); color: var(--durazno-t); box-shadow: 0 3px 0 var(--durazno-s); }
  .btn-2, .btn-3, .btn-4 { background: var(--suave); color: var(--tinta); box-shadow: none; }
  .btn-plano { background: transparent; color: var(--gris); box-shadow: inset 0 0 0 2px var(--borde); font-weight: 700; font-size: 15px; }
  .btn-peligro { background: transparent; color: var(--coral-t); box-shadow: none; font-weight: 700; font-size: 15px; }
  .btn:active { transform: translateY(2px); box-shadow: none; }
  .par { display: flex; gap: 10px; }
  .par .btn { flex: 1; }

  .seg { display: flex; gap: 4px; background: var(--tarjeta); padding: 4px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 3px 10px var(--sombra); }
  .seg button { flex: 1; padding: 10px 4px; border-radius: 12px; font-size: 14px; font-weight: 700; color: var(--gris); min-height: 40px; }
  .seg button.sel { background: var(--durazno); color: var(--durazno-t); }

  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .filtro { padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 700; background: var(--tarjeta); box-shadow: 0 2px 8px var(--sombra); min-height: 44px; }
  .filtro.sel { background: var(--durazno); color: var(--durazno-t); }

  .campo, .buscador { width: 100%; font-family: inherit; font-size: 16px; color: var(--tinta); padding: 14px 16px; background: var(--tarjeta); border: 2px solid var(--borde); border-radius: 16px; margin-bottom: 12px; }
  .campo:focus, .buscador:focus { border-color: var(--durazno-s); outline: none; }
  textarea.campo { min-height: 80px; resize: vertical; }
  .etiqueta { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--gris); margin: 14px 0 8px; }
  .pista { font-size: 13px; color: var(--gris); margin: -4px 0 12px; }

  .receta { display: block; width: 100%; text-align: left; background: var(--tarjeta); border-radius: 20px; padding: 15px 17px; margin-bottom: 8px; box-shadow: 0 2px 8px var(--sombra); }
  .receta h3 { font-size: 16px; font-weight: 800; margin: 0 0 3px; }
  .receta p { margin: 0; font-size: 13px; color: var(--gris); }
  .marcas { display: flex; gap: 6px; margin-top: 9px; flex-wrap: wrap; }
  .marca { font-size: 10px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 7px; padding: 4px 8px; background: var(--suave); color: var(--gris); }
  .vacio-msg { color: var(--gris); font-size: 15px; padding: 16px 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--tarjeta); border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 2px 8px var(--sombra); min-height: 40px; }
  .chip button { color: var(--gris); font-size: 18px; line-height: 1; min-height: 0; }
  .chip.n, .chip.t { background: var(--durazno); color: var(--durazno-t); box-shadow: none; }

  .titulo { font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); margin: 20px 0 8px; }
  .sub { font-size: 12.5px; color: var(--gris); margin: 0 0 14px; line-height: 1.5; }
  .barra { display: flex; gap: 3px; margin-top: 8px; }
  .barra i { width: 15px; height: 6px; background: var(--borde); border-radius: 3px; }
  .barra i.si { background: var(--menta-s); }

  .rejilla { background: var(--tarjeta); border-radius: 22px; padding: 12px; margin-bottom: 16px; box-shadow: 0 6px 18px var(--sombra); }
  .fila-r { display: flex; align-items: stretch; gap: 5px; margin-bottom: 5px; }
  .dia-r { flex: none; width: 28px; font-size: 11px; font-weight: 800; color: var(--gris); display: flex; align-items: center; }
  .fila-r.hoy .dia-r { color: var(--durazno-t); }
  .celda { flex: 1; min-width: 0; background: var(--fondo); border-radius: 12px; padding: 8px 7px; font-size: 10px; font-weight: 700; line-height: 1.25; text-align: left; overflow: hidden; height: 46px; min-height: 46px; }
  .celda .pto { display: block; width: 8px; height: 8px; border-radius: 50%; background: var(--borde); margin-bottom: 3px; }
  .cabecera-r { display: flex; gap: 5px; margin: 0 0 6px 33px; }
  .cabecera-r span { flex: 1; font-size: 10px; font-weight: 800; color: var(--gris); text-transform: uppercase; letter-spacing: .04em; }

  .anillos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .celda-obj { background: var(--tarjeta); border-radius: 20px; padding: 14px 10px 16px; box-shadow: 0 2px 8px var(--sombra); display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 132px; }
  .celda-obj b { font-size: 14px; font-weight: 800; margin-top: 4px; }
  .celda-obj span { font-size: 11px; color: var(--gris); font-weight: 700; }
  .anillo { width: 64px; height: 64px; }
  .anillo-n { font-size: 20px; font-weight: 800; fill: var(--tinta); font-family: 'Nunito', sans-serif; }
  .obj { background: var(--tarjeta); border-radius: 20px; padding: 16px 17px; margin-bottom: 8px; box-shadow: 0 2px 8px var(--sombra); }
  .obj-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .obj-cab b { font-size: 16px; font-weight: 800; }
  .obj-cab span { font-size: 13px; font-weight: 700; color: var(--gris); text-align: right; }
  .pips { display: flex; gap: 4px; margin: 10px 0 8px; flex-wrap: wrap; }
  .pip { width: 22px; height: 10px; border-radius: 5px; background: var(--borde); }
  .pip.on { background: var(--menta-s); }
  .pip.sobra { background: var(--coral-s); }
  .obj p { margin: 0; font-size: 13px; color: var(--gris); }
  .obj.bien { box-shadow: 0 4px 12px var(--sombra), inset 4px 0 0 var(--menta-s); }
  .obj.falta { box-shadow: 0 4px 12px var(--sombra), inset 4px 0 0 var(--limon-s); }
  .obj.pasa { box-shadow: 0 4px 12px var(--sombra), inset 4px 0 0 var(--coral-s); }
  .grafica { display: flex; align-items: flex-end; gap: 6px; height: 130px; margin-top: 6px; }
  .grafica .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; }
  .grafica .vv { font-size: 10px; font-weight: 800; color: var(--gris); margin-bottom: 3px; }
  .grafica .bb { width: 100%; background: var(--borde); border-radius: 8px 8px 3px 3px; }
  .grafica .bb.act { background: var(--durazno-s); }
  .grafica .ee { font-size: 9px; font-weight: 700; color: var(--gris); margin-top: 5px; }
  .spark { display: flex; align-items: flex-end; gap: 5px; height: 34px; margin-top: 10px; }
  .spark div { flex: 1; background: var(--borde); border-radius: 4px 4px 0 0; min-height: 3px; }
  .spark div.act { background: var(--durazno-s); }
  .spark-pie { display: flex; gap: 5px; margin-top: 4px; }
  .spark-pie span { flex: 1; font-size: 9px; font-weight: 700; color: var(--gris); text-align: center; }

  .editor { background: var(--tarjeta); border-radius: 18px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 3px 10px var(--sombra); }
  .editor-cab { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .editor-cab b { font-size: 15px; font-weight: 800; }
  .paso { display: flex; align-items: center; gap: 10px; }
  .paso button { width: 44px; height: 44px; border-radius: 14px; font-weight: 800; font-size: 20px; background: var(--fondo); box-shadow: inset 0 0 0 2px var(--borde); }
  .paso b { min-width: 28px; text-align: center; font-size: 18px; font-weight: 800; }
  .quitar { font-size: 13px; font-weight: 700; color: var(--coral-t); min-height: 40px; }
  .colores { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .color { width: 36px; height: 36px; min-height: 36px; border-radius: 12px; }
  .color.sel { outline: 3px solid var(--tinta); outline-offset: 2px; }

  nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 640px; margin: 0 auto; display: flex; gap: 4px; background: var(--tarjeta); border-top: 1px solid var(--borde); padding: 8px 8px calc(10px + env(safe-area-inset-bottom)); }
  nav button { flex: 1; padding: 6px 2px; font-size: 10px; font-weight: 700; color: var(--gris); border-radius: 14px; min-height: 52px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  nav button.activa { color: var(--durazno-t); background: var(--durazno); }

  .fondo-modal { position: fixed; inset: 0; background: rgba(40,32,37,.42); display: flex; align-items: flex-end; z-index: 20; }
  .hoja { width: 100%; max-width: 640px; margin: 0 auto; max-height: 92vh; max-height: 92dvh; overscroll-behavior: contain; overflow-y: auto; background: var(--fondo); border-radius: 28px 28px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); animation: subir .24s cubic-bezier(.2,.8,.3,1); }
  @keyframes subir { from { transform: translateY(24px); opacity: .5; } }
  @media (prefers-reduced-motion: reduce) { .hoja { animation: none; } }
  .pie-hoja { position: sticky; bottom: 0; z-index: 2; background: var(--fondo); margin: 8px -20px 0; padding: 10px 20px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -12px 16px -12px var(--sombra); }
  .pie-hoja .btn { margin-bottom: 8px; }
  .pie-hoja .btn:last-child { margin-bottom: 0; }
  .asa { width: 40px; height: 4px; border-radius: 2px; background: var(--borde); margin: 6px auto 14px; }
  .hoja h2 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; margin: 0 0 8px; }
  .texto-receta { -webkit-user-select: text; user-select: text; background: var(--tarjeta); border-radius: 18px; padding: 16px; font-size: 15px; white-space: pre-wrap; max-height: 30vh; overflow-y: auto; margin-bottom: 14px; }

  .moviendo, .aviso { position: fixed; left: 14px; right: 14px; max-width: 612px; margin: 0 auto; bottom: calc(102px + env(safe-area-inset-bottom)); background: var(--lavanda); color: var(--lavanda-t); border-radius: 18px; padding: 14px 16px; font-size: 14px; font-weight: 700; box-shadow: 0 6px 20px rgba(40,32,37,.2); }
  .moviendo { display: flex; align-items: center; gap: 12px; z-index: 15; }
  .moviendo strong { font-weight: 800; flex: 1; }
  .moviendo button { color: var(--durazno-t); background: var(--durazno); padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 13px; min-height: 0; }
  .aviso { z-index: 30; }
</style>
</head>
<body>

<header>
  <div>
    <h1 id="titulo-p">Hoy</h1>
    <div class="fecha" id="fecha"></div>
    <div class="fecha" id="estado-sync" style="font-size:11px"></div>
  </div>
  <button class="ico" onclick="hojaAjustes()">Ajustes</button>
</header>

<main>
  <section id="v-hoy"></section>
  <section id="v-semana" class="oculto"></section>
  <section id="v-recetas" class="oculto"></section>
  <section id="v-dieta" class="oculto"></section>
  <section id="v-despensa" class="oculto"></section>
</main>

<nav>
  <button id="t-hoy" class="activa" onclick="verVista('hoy')" aria-label="Hoy"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Hoy</span></button>
  <button id="t-semana" onclick="verVista('semana')" aria-label="Semana"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg><span>Semana</span></button>
  <button id="t-recetas" onclick="verVista('recetas')" aria-label="Recetas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/><path d="M9 9h7M9 13h5"/></svg><span>Recetas</span></button>
  <button id="t-dieta" onclick="verVista('dieta')" aria-label="Dieta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg><span>Dieta</span></button>
  <button id="t-despensa" onclick="verVista('despensa')" aria-label="Cocina"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M4 12h16M10 8v0M10 16v0"/></svg><span>Cocina</span></button>
</nav>

<div id="capa"></div>

<script>
const DIAS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const COMIDAS = ['Desayuno','Comida','Cena'];
const PERSONAS = ['Jaco','Alba'];
const DIA_MS = 86400000;
const PALETA = ['durazno','menta','lavanda','limon','coral','cielo','arena'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const SINTOMAS = ['Ardor','Reflujo','Hinchazón','Pesadez','Dolor','Gases'];
function rapidosPorDefecto(){
  return ['Ensalada','Bocadillo','Sándwich','Tortilla francesa','Pasta','Arroz','Sopa o caldo','Pollo a la plancha',
          'Pescado a la plancha','Verdura salteada','Legumbres de bote','Fruta y yogur','Pizza','Hamburguesa',
          'Menú del día','Tapas o picoteo','Sushi','Comida de restaurante'];

function subir(){

  if(SUBIENDO){ PENDIENTE=true; return; }

  fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({token:TOKEN,rev:REV,datos:DATOS})})

      } else {

function migrar(){
  const base=datosIniciales();
  if(!Array.isArray(DATOS.sitios)||!DATOS.sitios.length) DATOS.sitios=base.sitios;
  else {
    const tiene=function(re){ return DATOS.sitios.some(function(s){ return re.test(norm(s.n)); }); };
    if(!tiene(/nevera|frigor/)) DATOS.sitios.unshift({n:'Frigorífico',items:[]});
    if(!tiene(/congelador|congela/)){
      let iFrio=0;
      DATOS.sitios.forEach(function(s,i){ if(/nevera|frigor/.test(norm(s.n))) iFrio=i; });
      DATOS.sitios.splice(iFrio+1,0,{n:'Congelador',items:[]});
    }
    if(!tiene(/huerto/)) DATOS.sitios.push({n:'Huerto',items:[]});
    if(!tiene(/despensa|alacena/)) DATOS.sitios.push({n:'Despensa',items:[]});
    DATOS.sitios.forEach(function(s){ s.items=s.items||[]; });
  }
  if(!Array.isArray(DATOS.rapidos)||!DATOS.rapidos.length) DATOS.rapidos=base.rapidos;
  if(!Array.isArray(DATOS.compra)) DATOS.compra=[];
  if(!DATOS.destinos) DATOS.destinos={};
  if(!DATOS.freq) DATOS.freq={};
  if(!DATOS.opciones) DATOS.opciones=base.opciones;
  if(DATOS.opciones) delete DATOS.opciones.registro;
  delete DATOS.sensaciones;
  if(!Array.isArray(DATOS.objetivos)||!DATOS.objetivos.length) DATOS.objetivos=base.objetivos;
  if(!Array.isArray(DATOS.gruposDef)||!DATOS.gruposDef.length) DATOS.gruposDef=base.gruposDef;
  if(!Array.isArray(DATOS.dificultades)||!DATOS.dificultades.length) DATOS.dificultades=base.dificultades;
  if(!Array.isArray(DATOS.historial)) DATOS.historial=[];
  if(!Array.isArray(DATOS.plantillas)) DATOS.plantillas=[];
  if(!DATOS.prox) DATOS.prox=semanaVacia();
  if(!DATOS.inicio) DATOS.inicio=lunesDe(new Date()).getTime();
  if(!DATOS.variedad) DATOS.variedad=30;
  ['menu','segundo','aparte','cocinas','fijos','sobras','guarnicion','doble','registro'].forEach(function(c){
    [DATOS.act,DATOS.prox].forEach(function(sem){ if(sem && !sem[c]) sem[c]={}; });
  });
  DATOS.recetas.forEach(function(r){ r.grupos=r.grupos||[]; r.ingredientes=r.ingredientes||[]; });
  guardar();
}
function attr(s){var t=String(s).split(String.fromCharCode(92)).join(String.fromCharCode(92,92));t=t.split(String.fromCharCode(39)).join(String.fromCharCode(92,39));return esc(t);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
function raiz(p){return p.replace(/(es|s)$/,'');}
function coincide(a1,b1){
  const a=norm(a1), b=norm(b1);
  if(!a||!b) return false;
  if(a.indexOf(b)!==-1||b.indexOf(a)!==-1) return true;
  const pa=a.split(' ').map(raiz), pb=b.split(' ').map(raiz);
  return pb.some(function(x){return x.length>2&&pa.indexOf(x)!==-1;});
}

}

function verVista(v){
  VISTA=v;
  if(v!=='semana') SEMANA_VISTA='act';
  ['hoy','semana','recetas','dieta','despensa'].forEach(function(x){
    document.getElementById('v-'+x).classList.toggle('oculto', x!==v);
    document.getElementById('t-'+x).classList.toggle('activa', x===v);
  });
  pintar(); window.scrollTo(0,0);
}
function resumenSemana(sem){
  const s=sem||DATOS.act;
  // Solo los objetivos comunes: el historial se comparte y los propios no salen de este móvil.
  const plan={}; (DATOS.objetivos||[]).forEach(function(o){plan[o.nombre]=cuentaPlan(o,s);});
  let n=0;
  (DATOS.objetivos||[]).forEach(function(o){
    const v=cuentaPlan(o,s);
    if(o.tipo==='min'?v>=o.obj:v<=o.obj) n++;
  });
  return {plan:plan, cumplidos:n, variedad:variedadPlan(s)};
}
function archivarSemana(sem,etiqueta){
  const usadas=Object.keys(sem.menu).filter(function(k){return sem.menu[k];});
  if(!usadas.length) return false;
  const r=resumenSemana(sem);
  DATOS.historial.push({nombre:etiqueta,ts:Date.now(),plan:r.plan,cumplidos:r.cumplidos,variedad:r.variedad});
  if(DATOS.historial.length>60) DATOS.historial=DATOS.historial.slice(-60);
  DATOS.plantillas.push({id:'p'+Date.now()+Math.floor(Math.random()*99),nombre:etiqueta,
    menu:Object.assign({},sem.menu),cocinas:Object.assign({},sem.cocinas)});
  usadas.forEach(function(k){
    const rec=receta(sem.menu[k]);
    if(rec&&!sem.sobras[k]){rec.veces+=1;rec.ultimaTs=Date.now();}
  });
  return true;
}
function pasarDeSemana(){
  const vieja=DATOS.act;
  const f=new Date(DATOS.inicio);
  archivarSemana(vieja,'Semana '+f.getDate()+' '+MESES[f.getMonth()].slice(0,3));
  const nueva=DATOS.prox;
  Object.keys(vieja.fijos).forEach(function(k){
    if(vieja.fijos[k]&&vieja.menu[k]){
      nueva.fijos[k]=true;
      if(!nueva.menu[k]){ nueva.menu[k]=vieja.menu[k]; nueva.cocinas[k]=vieja.cocinas[k]; }
    }
  });
  DATOS.act=nueva;
  DATOS.prox=semanaVacia();
  Object.keys(nueva.fijos).forEach(function(k){ if(nueva.fijos[k]&&nueva.menu[k]){ DATOS.prox.fijos[k]=true; DATOS.prox.menu[k]=nueva.menu[k]; } });
  DATOS.inicio=lunesDe(new Date()).getTime();
  // el diario personal es de la semana que acaba: se archiva y se empieza limpio
  LOCAL.reg={}; LOCAL.regSemana=DATOS.inicio; guardarLocal();
  guardar();
}
function comprobarSemana(){
  const lunes=lunesDe(new Date()).getTime();
  let vueltas=0;
  while(DATOS.inicio<lunes && vueltas<8){ pasarDeSemana(); vueltas++; }
  if(vueltas) aviso('Semana cerrada sola. La que planificasteis ya está activa.');
  return vueltas;
}

function rangoSemana(prox){
  const l=new Date(DATOS.inicio||lunesDe(new Date()).getTime());
  if(prox) l.setDate(l.getDate()+7);
  const d=new Date(l); d.setDate(d.getDate()+6);
  const m1=MESES[l.getMonth()], m2=MESES[d.getMonth()];
  return l.getDate()+(m1===m2?'':' de '+m1)+' al '+d.getDate()+' de '+m2;
}
function cabecera(){
  const f=new Date();
  const fechaHoy=DIAS[indiceHoy()]+', '+f.getDate()+' de '+MESES[f.getMonth()];
  if(VISTA==='semana'){
    const prox=SEMANA_VISTA==='prox';
    return [prox?'La que viene':'Esta semana', rangoSemana(prox)];
  }
  if(VISTA==='recetas'){
    const n=DATOS.recetas.length;
    return ['Recetas', n+(n===1?' guardada':' guardadas')];
  }
  if(VISTA==='dieta') return ['Dieta', 'Esta semana'+(yo()?' · '+yo():'')];
  if(VISTA==='despensa'){
    const c=(DATOS.compra||[]).length, e=enCasa().length;
    return ['Cocina', (c?c+' por comprar · ':'')+e+' cosas en casa'];
  }
  return ['Hoy', fechaHoy];
}
function pintar(){
  aplicarTema();
  const tb=document.getElementById('t-despensa');
  if(tb) tb.classList.toggle('con-punto',((DATOS.compra||[]).length>0));
  const cab=cabecera();
  document.getElementById('titulo-p').textContent = cab[0];
  document.getElementById('fecha').textContent = cab[1];
  if(VISTA==='hoy') pintarHoy();
  if(VISTA==='semana') pintarSemana();
  if(VISTA==='recetas') pintarRecetas();
  if(VISTA==='dieta') pintarDieta();
  if(VISTA==='despensa') pintarDespensa();
  pintarBarraMover();
  actualizarGlobo();
  guardar();
}

/* ---------- HOY (el registro es personal: vive solo en este móvil) ---------- */
function regTodo(){
  if(!LOCAL.reg || LOCAL.regSemana!==DATOS.inicio){ LOCAL.reg={}; LOCAL.regSemana=DATOS.inicio; }
  return LOCAL.reg;
}
function getReg(k){ const r=regTodo()[k]; return r||null; }
function setReg(k,v){ regTodo()[k]=v; guardarLocal(); }
function delReg(k){ delete regTodo()[k]; guardarLocal(); }
function moverReg(a,b){
  const t=regTodo()[a]; const u=regTodo()[b];
  if(u) regTodo()[a]=u; else delete regTodo()[a];
  if(t) regTodo()[b]=t; else delete regTodo()[b];
  guardarLocal();
}
function apunta(){ return LOCAL.apuntar!==false; }
function registroActivo(){ return apunta(); }

function pendientesDia(dia){
  return COMIDAS.filter(function(c){ const k=dia+'|'+c; return S().menu[k] && !getReg(k); });
}
function sinApuntar(){
  if(!apunta()) return 0;
  let n=0;
  const hasta=indiceHoy();
  for(let i=0;i<=hasta;i++){
    const d=DIAS[i];
    COMIDAS.forEach(function(c){
      const k=d+'|'+c;
      if(DATOS.act.menu[k] && !getReg(k)) n++;
    });
  }
  return n;
}
function actualizarGlobo(){
  if(!('setAppBadge' in navigator)) return;
  const n=sinApuntar();
  try{ n>0 ? navigator.setAppBadge(n) : navigator.clearAppBadge(); }catch(e){}
}
function pedirGlobo(){
  if(!('Notification' in window)){ aviso('Este iPhone no lo admite. Hace falta iOS 16.4 o más.'); return; }
  Notification.requestPermission().then(function(p){
    if(p==='granted'){ actualizarGlobo(); aviso('Listo. El globo enseñará lo que te quede por apuntar.'); }
    else aviso('Sin permiso no se puede pintar el globo.');

}

function nuevoReg(){ return {q:'plan',ing:[],gr:[],txt:'',s:'',sint:[],tarde:false}; }

function etiquetaComido(k){
  const v=getReg(k); if(!v) return '';

function registrar(dia,comida,tipo){
  const k=dia+'|'+comida;
  const previo=getReg(k);
  const v=nuevoReg();
  v.q = tipo==='igual' ? 'plan' : 'no';
  if(previo){ v.s=previo.s||''; v.sint=previo.sint||[]; }
  setReg(k,v);
  hojaRegistro(dia); pintar();
}

function sentar(dia,comida,valor){
  const k=dia+'|'+comida;
  let v=getReg(k); if(!v){ v=nuevoReg(); }
  v.s=valor; setReg(k,v);
  if(valor==='bien'){ v.sint=[]; setReg(k,v); anotarSensacion(dia,comida); hojaRegistro(dia); pintar(); return; }
  // se guarda ya, aunque no llegue a detallar los síntomas
  anotarSensacion(dia,comida);
  hojaSintomas(dia,comida);
}

function hojaSintomas(dia,comida){
  const k=dia+'|'+comida;
  const v=getReg(k); if(!v) return;
  let h='<h2>¿Cómo te sentó?</h2><p class="sub">Opcional. Marca lo que notaste, si quieres.</p><div class="filtros">';
  SINTOMAS.forEach(function(s){
    h+='<button class="filtro'+((v.sint||[]).indexOf(s)!==-1?' sel':'')+'" onclick="alternarSintoma(\''+dia+'\',\''+comida+'\',\''+attr(s)+'\')">'+s+'</button>';
  });
  h+='</div>';
  if(comida==='Cena'){
    h+='<button class="btn '+(v.tarde?'btn-2':'btn-plano')+'" onclick="alternarTarde(\''+dia+'\',\''+comida+'\')">Cené tarde o me acosté pronto después</button>'+
       '<p class="pista">Las guías recomiendan no tumbarse hasta unas tres horas después de comer. Guardarlo ayuda a distinguir si fue el plato o el horario.</p>';
  }
  h+='<button class="btn btn-1" onclick="anotarSensacion(\''+dia+'\',\''+comida+'\');hojaRegistro(\''+dia+'\')">Guardar</button>';
  abrirHoja(h);
}
function alternarSintoma(dia,comida,s){
  const k=dia+'|'+comida, v=getReg(k); if(!v) return;
  v.sint=v.sint||[];
  const i=v.sint.indexOf(s);
  if(i===-1) v.sint.push(s); else v.sint.splice(i,1);
  setReg(k,v); hojaSintomas(dia,comida);
}
function alternarTarde(dia,comida){
  const k=dia+'|'+comida, v=getReg(k); if(!v) return;
  v.tarde=!v.tarde; setReg(k,v); hojaSintomas(dia,comida);
}
function anotarSensacion(dia,comida){
  const k=dia+'|'+comida;

  const propio = v.q==='plan';

  LOCAL.sensaciones=LOCAL.sensaciones.filter(function(x){return !(x.clave===k&&x.semana===DATOS.inicio);});
  LOCAL.sensaciones.push({
    ts:Date.now(), clave:k, semana:DATOS.inicio,
    recetaId: propio&&r?r.id:null,
    nombre: propio&&r?r.nombre:((v.ing&&v.ing.length)?v.ing.join(', '):(v.txt||'fuera del menú')),
    ing: propio&&r?r.ingredientes:(v.ing||[]),
    s:v.s, sint:v.sint||[], tarde:!!v.tarde

function copiarDia(origen,destino){

  });

function anteriorConPlato(dia,comida){

  DATOS.dias.forEach(function(d){DATOS.comidas.forEach(function(c){orden.push(d+'|'+c);});});
  const i=orden.indexOf(dia+'|'+comida);

function tocarHueco(dia,comida){
  if(MOVIENDO){
    if(MOVIENDO.dia===dia&&MOVIENDO.comida===comida){MOVIENDO=null;pintar();return;}
    const a=MOVIENDO.dia+'|'+MOVIENDO.comida, b=dia+'|'+comida;
    ['menu','cocinas','sobras','guarnicion','doble'].forEach(function(c){
      const t=S()[c][b]; S()[c][b]=S()[c][a]; S()[c][a]=t;
    });
    moverReg(a,b);
    MOVIENDO=null; pintar(); return;
  }
  const id=S().menu[dia+'|'+comida];
  if(id) hojaPlato(dia,comida,id); else hojaElegir(dia,comida);

/* ---------- DIETA ---------- */
function clavesPrincipales(){
  const l=[];
  DATOS.dias.forEach(function(d){['Comida','Cena'].forEach(function(m){l.push(d+'|'+m);});});
  return l;
}
function platosDe(k,sem){
  const s=sem||DATOS.act;
  const ap=s.aparte&&s.aparte[k];
  const base = (ap && ap.p===yo() && ap.id) ? ap.id : s.menu[k];
  const l=[receta(base)];
  if(s.segundo&&s.segundo[k]) l.push(receta(s.segundo[k]));
  return l.filter(Boolean);
}
function platoPlan(k,sem){
  const s=sem||DATOS.act;
  const l=platosDe(k,s);
  if(!l.length) return {grupos:[],guar:false,hay:false};
  let g=[];
  l.forEach(function(r){ g=g.concat(r.grupos||[]); });
  return {grupos:g, guar:s.guarnicion[k], hay:true};
}
function platoReal(k){
  const v=getReg(k); if(!v||v.q==='no') return {grupos:[],guar:false,hay:false};
  if(v.q==='plan') return platoPlan(k);
  return {grupos:v.gr||[],guar:false,hay:true};
}
function cuentaCon(o,fn){
  const mira=o.grupos.some(function(g){return /verdura/i.test(g);});
  return clavesPrincipales().filter(function(k){
    const d=fn(k);
    if(!d.hay) return false;
    if(d.grupos.some(function(g){return o.grupos.indexOf(g)!==-1;})) return true;
    return mira && d.guar;
  }).length;
}
function cuentaPlan(o,sem){ return cuentaCon(o,function(k){return platoPlan(k,sem);}); }
function cuentaReal(o){ return cuentaCon(o,platoReal); }
function cuenta(o){ return apunta() ? cuentaReal(o) : cuentaPlan(o,DATOS.act); }
function objsMios(){ return LOCAL.objetivos||[]; }
function objsTodos(){ return (DATOS.objetivos||[]).concat(objsMios()); }
function esMio(id){ return objsMios().some(function(o){return o.id===id;}); }
function objPorId(id){ return objsTodos().filter(function(o){return o.id===id;})[0]; }
function variedadSemana(){
  if(!apunta()) return variedadPlan(DATOS.act);
  const set={};
  clavesPrincipales().forEach(function(k){
    const r=receta(DATOS.act.menu[k]);
    const v=getReg(k); if(!v||v.q==='no') return;
    if(v.q==='plan'){ if(r) r.ingredientes.forEach(function(i){set[norm(i)]=true;}); }
    else (v.ing||[]).forEach(function(i){set[norm(i)]=true;});
  });
  return Object.keys(set).length;
}
function variedadPlan(sem){
  const s=sem||DATOS.act;
  const set={};
  clavesPrincipales().forEach(function(k){
    const r=receta(s.menu[k]);
    if(r) r.ingredientes.forEach(function(i){set[norm(i)]=true;});
  });
  return Object.keys(set).length;
}
function cumplidosAhora(){
  let n=0;
  objsTodos().forEach(function(o){
    const v=cuenta(o);
    if(o.tipo==='min'?v>=o.obj:v<=o.obj) n++;
  });

}
function cumplidosPlan(sem){
  let n=0;
  objsTodos().forEach(function(o){
    const v=cuentaPlan(o,sem);
    if(o.tipo==='min'?v>=o.obj:v<=o.obj) n++;
  });

}
function faltasPlan(sem){
  return objsTodos().map(function(o){
    const v=cuentaPlan(o,sem);
    const bien=o.tipo==='min'?v>=o.obj:v<=o.obj;
    if(bien) return null;
    return {o:o, txt: o.tipo==='min' ? 'faltan '+(o.obj-v)+' de '+o.nombre.toLowerCase() : (v-o.obj)+' de más de '+o.nombre.toLowerCase()};
  }).filter(Boolean);
}

let RANGO='sem', METRICA='cumplidos';
function metricas(){
  return [{id:'cumplidos',n:'Objetivos cumplidos'},{id:'variedad',n:'Variedad'}]
    .concat(objsTodos().map(function(o){return {id:o.nombre,n:o.nombre};}));
}
function valorHist(x,id){
  if(id==='cumplidos') return x.cumplidos||0;
  if(id==='variedad') return x.variedad||0;
  return (x.plan&&x.plan[id])||0;
}
function serieSeguimiento(){
  const hist=(DATOS.historial||[]).slice();
  if(RANGO==='sem'){
    return hist.slice(-8).map(function(x){ return {etq:x.nombre, v:valorHist(x,METRICA)}; });
  }
  const meses={};
  hist.forEach(function(x){
    const f=new Date(x.ts||Date.now());
    const k=f.getFullYear()+'-'+f.getMonth();
    if(!meses[k]) meses[k]={etq:MESES[f.getMonth()].slice(0,3), suma:0, n:0, orden:f.getFullYear()*12+f.getMonth()};
    meses[k].suma+=valorHist(x,METRICA); meses[k].n++;
  });
  return Object.keys(meses).map(function(k){return meses[k];})
    .sort(function(a,b){return a.orden-b.orden;}).slice(-6)
    .map(function(m){ return {etq:m.etq, v:Math.round(m.suma/m.n*10)/10}; });
}
function objetivoDe(id){
  const o=objsTodos().filter(function(x){return x.nombre===id;})[0];
  if(o) return {v:o.obj, tipo:o.tipo};
  if(id==='variedad') return {v:DATOS.variedad, tipo:'min'};
  if(id==='cumplidos') return {v:objsTodos().length, tipo:'min'};
  return null;
}
function bloqueSeguimiento(){
  const serie=serieSeguimiento();
  const meta=objetivoDe(METRICA);
  const max=Math.max.apply(null,serie.map(function(x){return x.v;}).concat([meta?meta.v:1,1]));
  const media=serie.length?Math.round(serie.reduce(function(a,b){return a+b.v;},0)/serie.length*10)/10:0;
  const ultimo=serie.length?serie[serie.length-1].v:0;
  const previos=serie.slice(0,-1);
  const mprev=previos.length?previos.reduce(function(a,b){return a+b.v;},0)/previos.length:null;
  let frase='Aún no hay suficiente para comparar.';
  if(mprev!==null){
    const d=ultimo-mprev;
    const mejor = meta && meta.tipo==='max' ? d<0 : d>0;
    frase = Math.abs(d)<0.4 ? 'Vais como siempre.' : (mejor?'Mejor que vuestra media.':'Por debajo de vuestra media.');
  }
  let h='<div class="obj"><div class="obj-cab"><b>Seguimiento</b><span>media '+media+'</span></div>'+
        '<div class="seg" style="margin:12px 0 6px;box-shadow:none;background:var(--fondo)">'+
        '<button class="'+(RANGO==='sem'?'sel':'')+'" onclick="RANGO=\'sem\';pintar()">Por semana</button>'+
        '<button class="'+(RANGO==='mes'?'sel':'')+'" onclick="RANGO=\'mes\';pintar()">Por mes</button></div>'+
        '<div class="filtros" style="margin-bottom:10px">';
  metricas().forEach(function(m){
    h+='<button class="filtro'+(METRICA===m.id?' sel':'')+'" onclick="METRICA=\''+esc(m.id)+'\';pintar()">'+esc(m.n)+'</button>';
  });
  h+='</div>';
  if(!serie.length) h+='<p class="vacio-msg">Todavía no hay semanas cerradas.</p>';
  else {
    h+='<div class="grafica">';
    serie.forEach(function(x,i){
      const alt=Math.max(4,Math.round(x.v/max*100));
      h+='<div class="col"><span class="vv">'+x.v+'</span><div class="bb'+(i===serie.length-1?' act':'')+'" style="height:'+alt+'%"></div><span class="ee">'+esc(x.etq)+'</span></div>';
    });
    h+='</div>';
    if(meta) h+='<p class="pista" style="margin:8px 0 0">Vuestro objetivo: '+(meta.tipo==='min'?'mínimo ':'máximo ')+meta.v+' por semana.</p>';
    h+='<p style="margin:6px 0 0">'+frase+'</p>';
  }
  return h+'</div>';
}
function sensDe(desdeDias){
  const lim = Date.now()-(desdeDias||90)*DIA_MS;
  return (LOCAL.sensaciones||[]).filter(function(x){return x.ts>=lim;});
}
function tolerancia(recetaId){
  const l=(LOCAL.sensaciones||[]).filter(function(x){return x.recetaId===recetaId;});
  if(!l.length) return null;
  const c={bien:0,regular:0,mal:0};
  l.forEach(function(x){ c[x.s]=(c[x.s]||0)+1; });
  return c;
}
function resumenTolerancia(){
  const l=sensDe(90);
  const c={bien:0,regular:0,mal:0};
  l.forEach(function(x){ c[x.s]=(c[x.s]||0)+1; });
  const platos={};
  l.forEach(function(x){
    const n=x.nombre||'sin nombre';
    if(!platos[n]) platos[n]={n:n,total:0,malo:0,id:x.recetaId};
    platos[n].total++; if(x.s!=='bien') platos[n].malo++;
  });
  const flojos=Object.keys(platos).map(function(k){return platos[k];})
    .filter(function(p){return p.total>=2 && p.malo/p.total>=0.5;})
    .sort(function(a,b){return (b.malo/b.total)-(a.malo/a.total)||b.total-a.total;});
  const ing={};
  l.forEach(function(x){
    (x.ing||[]).forEach(function(i){
      const n=norm(i); if(!n) return;
      if(!ing[n]) ing[n]={n:i,total:0,malo:0};
      ing[n].total++; if(x.s!=='bien') ing[n].malo++;
    });
  });
  const ingFlojos=Object.keys(ing).map(function(k){return ing[k];})
    .filter(function(p){return p.total>=3 && p.malo/p.total>=0.6;})
    .sort(function(a,b){return (b.malo/b.total)-(a.malo/a.total);}).slice(0,4);
  const sint={};
  l.forEach(function(x){(x.sint||[]).forEach(function(s){sint[s]=(sint[s]||0)+1;});});
  const sintOrden=Object.keys(sint).sort(function(a,b){return sint[b]-sint[a];}).slice(0,3)
    .map(function(s){return s+' ('+sint[s]+')';});
  const tardes=l.filter(function(x){return x.tarde;});
  const tardeMal=tardes.filter(function(x){return x.s!=='bien';}).length;
  return {c:c,total:l.length,flojos:flojos,ing:ingFlojos,sint:sintOrden,tardes:tardes.length,tardeMal:tardeMal};
}
function hojaTolerancia(){
  const r=resumenTolerancia();
  let h='<h2>Cómo te sienta</h2><p class="sub">Últimos tres meses · '+r.total+' comidas anotadas.</p>';
  if(!r.total){ h+='<p class="vacio-msg">Todavía no hay nada anotado. Se llena al apuntar los días.</p>'; }
  else {
    h+='<div class="editor"><div class="editor-cab"><b>Reparto</b></div>'+
       '<p class="pista" style="margin:0">Bien '+r.c.bien+' · Regular '+r.c.regular+' · Mal '+r.c.mal+'</p></div>';
    if(r.sint.length) h+='<div class="editor"><div class="editor-cab"><b>Lo que más notas</b></div><p class="pista" style="margin:0">'+esc(r.sint.join(' · '))+'</p></div>';
    if(r.flojos.length){
      h+='<div class="editor"><div class="editor-cab"><b>Platos que suelen sentar peor</b></div>';
      r.flojos.slice(0,5).forEach(function(p){

      });

    }
    if(r.ing.length){
      h+='<div class="editor"><div class="editor-cab"><b>Ingredientes que se repiten</b></div>';
      r.ing.forEach(function(p){
        h+='<p class="pista" style="margin:0 0 4px">'+esc(p.n)+': en '+p.malo+' de '+p.total+' comidas que no sentaron bien</p>';
      });
      h+='<p class="pista" style="margin:8px 0 0">Es una coincidencia en vuestros datos, no una causa demostrada.</p></div>';
    }
    if(r.tardes) h+='<div class="editor"><div class="editor-cab"><b>Cenas tardías</b></div><p class="pista" style="margin:0">'+r.tardeMal+' de '+r.tardes+' cenas tardías no te sentaron bien.</p></div>';
    h+='<div class="editor"><p class="pista" style="margin:0">Esto es un diario de síntomas, no un diagnóstico. Sirve para llevarlo a la consulta: las guías actuales recomiendan identificar los desencadenantes de cada persona en vez de retirar alimentos por lista, y esa decisión es de su médico o dietista.</p></div>';
  }
  h+='<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}

function anillo(v,meta,tipo){
  const pct = meta ? Math.min(1.4, v/meta) : 0;
  const bien = tipo==='min' ? v>=meta : v<=meta;
  const R=26, C=2*Math.PI*R;
  const trazo = Math.min(1,pct)*C;
  const color = bien?'var(--menta-s)':(tipo==='min'?'var(--limon-s)':'var(--coral-s)');
  return '<svg viewBox="0 0 64 64" class="anillo" aria-hidden="true">'+
    '<circle cx="32" cy="32" r="'+R+'" stroke="var(--borde)" stroke-width="7" fill="none"/>'+
    '<circle cx="32" cy="32" r="'+R+'" stroke="'+color+'" stroke-width="7" fill="none" stroke-linecap="round"'+
    ' stroke-dasharray="'+trazo.toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 32 32)"/>'+
    '<text x="32" y="36" text-anchor="middle" class="anillo-n">'+v+'</text></svg>';
}
function pintarDieta(){

  objsTodos().forEach(function(o){

  const va=variedadSemana();

     '<b>Variedad</b><span>de '+DATOS.variedad+' · '+(va>=DATOS.variedad?'bien':'a medias')+'</span></button></div>';

  if(act){

       '<button class="hueco" onclick="hojaTolerancia()">'+
       '<span class="nombre-plato">Ver el detalle</span>'+
       '<span class="mini gris">'+(rt.total?('bien '+rt.c.bien+' · reg '+rt.c.regular+' · mal '+rt.c.mal):'sin datos')+'</span>'+

  }

  h+=bloqueSeguimiento();

  if(DATOS.historial.length){
    h+='<div class="obj"><div class="obj-cab"><b>Semanas anteriores</b></div>';
    DATOS.historial.slice(-4).reverse().forEach(function(x,i){
      h+='<button class="hueco" onclick="hojaSemanaVieja('+(DATOS.historial.length-1-i)+')">'+
         '<span class="nombre-plato">'+esc(x.nombre)+'</span>'+
         '<span class="mini gris">'+x.cumplidos+' de '+(DATOS.objetivos||[]).length+'</span><span class="flecha">›</span></button>';
    });
    h+='</div>';
  }

  h+='<button class="btn btn-plano" onclick="hojaObjetivos()">Cambiar objetivos</button>'+
     '<p class="sub">Números orientativos, de la AESAN y de EAT-Lancet. No sustituyen a vuestro médico ni a un dietista.</p><div style="height:14px"></div>';
  document.getElementById('v-dieta').innerHTML=h;
}

function enLista(x){ return (DATOS.compra||[]).some(function(i){return norm(i.n)===norm(x);}); }
function tenemos(x){ return enCasa().some(function(a){return norm(a)===norm(x);}); }
function faltanDelMenu(){
  const set={};
  clavesPrincipales().forEach(function(k){
    const rs=[receta(DATOS.act.menu[k]), receta(DATOS.act.segundo&&DATOS.act.segundo[k]),
              receta(DATOS.act.aparte&&DATOS.act.aparte[k]?DATOS.act.aparte[k].id:'')].filter(Boolean);
    rs.forEach(function(r){
      r.ingredientes.forEach(function(i){
        if(enCasa().some(function(a){return coincide(i,a);})) return;
        if(enLista(i)) return;
        set[norm(i)]=i.charAt(0).toUpperCase()+i.slice(1);
      });
    });
  });
  return Object.keys(set).map(function(k){return set[k];});
}
function frecuentes(){
  const f=DATOS.freq||{};
  let l=Object.keys(f).sort(function(a,b){return f[b]-f[a];});
  if(l.length<8){
    const cuenta={};
    DATOS.recetas.forEach(function(r){ r.ingredientes.forEach(function(i){ cuenta[norm(i)]=(cuenta[norm(i)]||0)+1; }); });
    l=l.concat(Object.keys(cuenta).sort(function(a,b){return cuenta[b]-cuenta[a];}));
  }
  const vistos={};
  return l.filter(function(x){
    if(vistos[x]||tenemos(x)||enLista(x)) return false;
    vistos[x]=true; return true;
  }).slice(0,10).map(function(x){ return x.charAt(0).toUpperCase()+x.slice(1); });
}
function addCompra(nombre,auto){
  nombre=String(nombre||'').trim(); if(!nombre) return;
  if(enLista(nombre)){ aviso(nombre+' ya está en la lista.'); return; }
  DATOS.compra=DATOS.compra||[];
  DATOS.compra.push({id:'c'+Date.now()+Math.floor(Math.random()*999),n:nombre,auto:!!auto});
  const ya=dondeEsta(nombre);
  pintar();
  if(!auto && ya>=0) hojaQueda(nombre,ya);
}
function hojaQueda(nombre,idx){
  abrirHoja('<h2>'+esc(nombre)+'</h2><p class="sub">Lo tenéis en '+esc(DATOS.sitios[idx].n.toLowerCase())+'. ¿Queda algo?</p>'+
    '<button class="btn btn-2" onclick="cerrarHoja()">Sí, queda algo</button>'+
    '<button class="btn btn-1" onclick="seAcabo(\''+attr(nombre)+'\','+idx+')">No, se ha acabado</button>'+
    '<p class="pista" style="margin:10px 2px 0">Si se ha acabado lo saco de '+esc(DATOS.sitios[idx].n.toLowerCase())+' y se queda solo en la lista.</p>');
}
function seAcabo(nombre,idx){
  DATOS.destinos=DATOS.destinos||{}; DATOS.destinos[norm(nombre)]=idx;
  DATOS.sitios[idx].items=DATOS.sitios[idx].items.filter(function(y){return norm(y)!==norm(nombre);});
  cerrarHoja(); pintar(); aviso(nombre+' fuera de '+DATOS.sitios[idx].n.toLowerCase()+'.');
}
function sugerirProducto(txt){
  const cont=document.getElementById('sug-prod'); if(!cont) return;
  const q=norm(txt||'');
  if(q.length<2){ cont.innerHTML=''; return; }
  const l=todosProductos().filter(function(p){ return !p.lista && p.k.indexOf(q)!==-1; }).slice(0,6);
  const exacto=l.some(function(p){ return p.k===q; });
  let h='';
  l.forEach(function(p){
    h+='<button class="chip'+(p.casa?' t':'')+'" onclick="addDesdeSugerencia(\''+attr(p.n)+'\')">'+esc(p.n)+
       (p.casa?' · en casa':'')+'</button>';
  });
  if(!exacto && txt.trim()) h+='<button class="chip mas" onclick="addCompraCampo()">Añadir «'+esc(txt.trim())+'» tal cual</button>';
  cont.innerHTML=h;
}
function addDesdeSugerencia(n){
  const c=document.getElementById('compra-txt'); if(c) c.value='';
  const s=document.getElementById('sug-prod'); if(s) s.innerHTML='';
  addCompra(n,false);
}
function addCompraCampo(){
  const c=document.getElementById('compra-txt'); if(!c) return;
  const t=c.value.trim(); if(!t){aviso('Escribe o dicta un producto.');return;}
  t.split(/[,\n]/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(x){addCompra(x,false);});
  c.value='';
}
function addTodoElMenu(){
  const f=faltanDelMenu(); if(!f.length){aviso('No falta nada del menú.');return;}
  puntoDeVuelta('Añadidos '+f.length+' del menú');
  f.forEach(function(x){addCompra(x,true);});
  aviso(f.length+' cosas a la lista.');
}
function quitarCompra(id){
  const it=(DATOS.compra||[]).filter(function(x){return x.id===id;})[0];
  puntoDeVuelta('Quitado '+(it?it.n:'el producto'));
  DATOS.compra=DATOS.compra.filter(function(x){return x.id!==id;});
  pintar();
}
function dondeEsta(x){
  let idx=-1;
  (DATOS.sitios||[]).forEach(function(s,i){
    if((s.items||[]).some(function(y){return norm(y)===norm(x);})) idx=i;
  });
  return idx;
}
function comprado(id){
  const it=(DATOS.compra||[]).filter(function(x){return x.id===id;})[0]; if(!it) return;
  const ya=dondeEsta(it.n);
  const d=(ya>=0)?ya:(DATOS.destinos||{})[norm(it.n)];
  if(typeof d!=='number' || !DATOS.sitios[d]){ hojaDestino(id); return; }
  puntoDeVuelta(it.n+' guardado');
  if(ya<0) DATOS.sitios[d].items.push(it.n);
  DATOS.freq=DATOS.freq||{}; DATOS.freq[norm(it.n)]=(DATOS.freq[norm(it.n)]||0)+1;
  DATOS.compra=DATOS.compra.filter(function(x){return x.id!==id;});
  pintar();
  aviso(ya>=0 ? (it.n+', ya en '+DATOS.sitios[d].n.toLowerCase()+'.') : (it.n+' a '+DATOS.sitios[d].n.toLowerCase()+'.'));
}
function hojaDestino(id){
  const it=(DATOS.compra||[]).filter(function(x){return x.id===id;})[0]; if(!it) return;
  let h='<h2>'+esc(it.n)+'</h2><p class="sub">¿Dónde lo guardáis? Solo lo pregunto esta vez.</p>';
  DATOS.sitios.forEach(function(s,i){
    h+='<button class="btn btn-plano" onclick="fijarDestino(\''+id+'\','+i+')">'+esc(s.n)+'</button>';
  });
  h+='<button class="btn btn-plano" onclick="cerrarHoja()">Cancelar</button>';
  abrirHoja(h);
}
function fijarDestino(id,idx){
  const it=(DATOS.compra||[]).filter(function(x){return x.id===id;})[0]; if(!it) return;
  DATOS.destinos=DATOS.destinos||{};
  DATOS.destinos[norm(it.n)]=idx;
  cerrarHoja(); comprado(id);
}
function cambiarDestinoDe(nombre){
  let h='<h2>'+esc(nombre)+'</h2><p class="sub">A partir de ahora se guardará en…</p>';
  DATOS.sitios.forEach(function(s,i){
    h+='<button class="btn '+((DATOS.destinos||{})[norm(nombre)]===i?'btn-2':'btn-plano')+'" onclick="DATOS.destinos[\''+norm(nombre)+'\']='+i+';cerrarHoja();pintar();aviso(\'Apuntado.\')">'+esc(s.n)+'</button>';
  });
  h+='<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function gastadoYALaLista(x){
  puntoDeVuelta(x+' a la lista');
  const idx=(DATOS.sitios||[]).reduce(function(a,s,i){return (s.items||[]).some(function(y){return norm(y)===norm(x);})?i:a;},-1);
  if(idx>=0){ DATOS.destinos=DATOS.destinos||{}; DATOS.destinos[norm(x)]=idx; }
  quitarNevera(x); addCompra(x,false);
  cerrarHoja(); pintar(); aviso(x+' a la lista de la compra.');
}
function todosProductos(){
  const f=DATOS.freq||{}, set={};
  Object.keys(f).forEach(function(k){ set[k]=k; });
  DATOS.recetas.forEach(function(r){ r.ingredientes.forEach(function(i){ set[norm(i)]=i; }); });
  (DATOS.sitios||[]).forEach(function(s){ (s.items||[]).forEach(function(i){ set[norm(i)]=i; }); });
  return Object.keys(set).map(function(k){
    const n=set[k];
    return { n: n.charAt(0).toUpperCase()+n.slice(1), k:k, veces: f[k]||0, casa: tenemos(n), lista: enLista(n) };
  }).sort(function(a,b){ return b.veces-a.veces || a.n.localeCompare(b.n,'es'); });
}

  h+='<div class="par" style="margin:12px 0 4px">'+

function sugerencias(){
  return DATOS.recetas.map(function(r){
    const tengo=r.ingredientes.filter(function(i){return enCasa().some(function(a){return coincide(i,a);});});
    const faltan=r.ingredientes.filter(function(i){return tengo.indexOf(i)===-1;});
    return {r:r,tengo:tengo.length,total:r.ingredientes.length,faltan:faltan};
  }).filter(function(s){return s.total>0&&s.tengo>0;})
    .sort(function(a,b){return (b.tengo/b.total)-(a.tengo/a.total)||b.tengo-a.tengo;});
}
function addNevera(x,idx){
  const i = (typeof idx==='number')?idx:0;
  if(enCasa().some(function(a){return a.toLowerCase()===x.toLowerCase();})){ aviso(x+' ya lo tenéis.'); return; }
  DATOS.sitios[i].items.push(x);
  pintar(); aviso(x+' a '+DATOS.sitios[i].n.toLowerCase()+'.');
}
function moverItem(x,destino){
  DATOS.sitios.forEach(function(s){ s.items=(s.items||[]).filter(function(i){return i.toLowerCase()!==x.toLowerCase();}); });
  DATOS.sitios[destino].items.push(x);
  cerrarHoja(); pintar();
}
function gastadoYALaLista(x){
  puntoDeVuelta(x+' a la lista');
  const idx=(DATOS.sitios||[]).reduce(function(a,s,i){return (s.items||[]).some(function(y){return norm(y)===norm(x);})?i:a;},-1);
  if(idx>=0){ DATOS.destinos=DATOS.destinos||{}; DATOS.destinos[norm(x)]=idx; }
  quitarNevera(x); addCompra(x,false);
  cerrarHoja(); pintar(); aviso(x+' a la lista de la compra.');
}
function hojaItem(x){
  let h='<h2>'+esc(x)+'</h2><p class="sub">Está en '+esc(sitioDe(x)||'ningún sitio')+'.</p><p class="etiqueta">Moverlo a</p>';
  DATOS.sitios.forEach(function(s,i){
    h+='<button class="btn '+(s.n===sitioDe(x)?'btn-2':'btn-plano')+'" onclick="moverItem(\''+attr(x)+'\','+i+')">'+esc(s.n)+'</button>';
  });
  h+='<button class="btn btn-1" onclick="gastadoYALaLista(\''+attr(x)+'\')">Se ha gastado, apuntadlo para comprar</button>'+
     '<button class="btn btn-plano" onclick="quitarNevera(\''+attr(x)+'\');cerrarHoja()">Se ha gastado y no hace falta comprarlo</button>'+
     '<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function guardarNevera(idx){
  const t=document.getElementById('nev-txt-'+idx).value;
  if(!t.trim()){aviso('Escribe algo primero.');return;}
  t.split(/[,\n]/).map(function(s){return s.trim();}).filter(Boolean).forEach(function(it){
    if(!enCasa().some(function(a){return a.toLowerCase()===it.toLowerCase();})) DATOS.sitios[idx].items.push(it);
  });
  pintar();
}
function quitarNevera(a){
  DATOS.sitios.forEach(function(s){ s.items=(s.items||[]).filter(function(x){return x.toLowerCase()!==a.toLowerCase();}); });
  pintar();
}
