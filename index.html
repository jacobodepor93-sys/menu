function interruptor(titulo,desc,activo,fn,marca){
  return '<div class="fila-aj" style="align-items:flex-start"><span><b>'+titulo+(marca?' <i class="solo-aqui">solo en este móvil</i>':'')+'</b><span>'+desc+'</span></span>'+
         '<button class="mini-sens'+(activo?' sel-bien':'')+'" onclick="'+fn+'">'+(activo?'Sí':'No')+'</button></div>';
}
function hojaAjustes(){
  let h='<h2>Ajustes</h2><p class="sub">Ordenados por la pantalla a la que afectan. '+(yo()?'Este móvil es el de '+yo()+'.':'')+'</p>';

  h+='<p class="etiqueta">Hoy</p>'+
    '<div class="fila-aj" style="display:block"><b>Apuntar lo que como <i class="solo-aqui">solo en este móvil</i></b>'+
    '<span style="display:block;font-size:12.5px;color:var(--gris);font-weight:600;line-height:1.45;margin:2px 0 10px">Tu diario de comidas y de cómo te sientan. Se guarda solo en este teléfono: ni se sincroniza ni lo ve la otra persona. Apagado, Dieta cuenta el menú planificado.</span>'+
    '<div class="editor-cab"><b style="font-weight:700">Apuntarlo</b>'+
    '<button class="mini-sens'+(apunta()?' sel-bien':'')+'" onclick="alternarApunte()">'+(apunta()?'Sí':'No')+'</button></div></div>'+
    filaAjuste('hojaRapidos()','Comidas de fuera del menú','Las que se ofrecen al apuntar que comisteis otra cosa: bocadillo, menú del día…');
  if(TIENE_GLOBO) h+=filaAjuste('pedirGlobo()','Globo rojo en el icono','Enseña cuántas comidas quedan por apuntar. Hay que dar permiso una vez.',true);

  h+='<p class="etiqueta">Semana</p>'+
    interruptor('Ver la semana en cuadrícula','Los siete días y las tres comidas de un vistazo, además del día a día.',LOCAL.rejilla,'alternarOpcion(\'rejilla\')',true);

  h+='<p class="etiqueta">Recetas</p>'+
    filaAjuste('hojaGrupos()','Grupos de alimentos','Legumbre, pescado, verdura… Son las etiquetas de cada receta y de ellas salen los objetivos.')+
    filaAjuste('hojaDificultades()','Niveles de dificultad','Rápido, con tiempo, de finde. Como habléis en casa.')+
    interruptor('Filtrar por dificultad','Añade esos botones al elegir plato para un día.',LOCAL.dificultad,'alternarOpcion(\'dificultad\')',true);

  h+='<p class="etiqueta">Dieta</p>'+
    filaAjuste('hojaObjetivos()','Objetivos de la semana','Cuántas veces queréis que salga cada cosa, y cuántos ingredientes distintos.');

  h+='<p class="etiqueta">Cocina</p>'+
    filaAjuste('hojaSitios()','Sitios donde guardáis la comida','Frigorífico, congelador, huerto, despensa. Podéis renombrarlos y añadir más.');

  h+='<p class="etiqueta">Este móvil</p>'+
    filaAjuste('hojaQuien()','Quién lo usa', yo()? yo()+'. Cámbialo si os intercambiáis el teléfono.' : 'Sin elegir todavía.',true)+
    filaAjuste('hojaTema()','Color de la app','Seis paletas suaves. Alba puede tener otra distinta.',true);

  h+='<p class="etiqueta">Todo</p>'+
    filaAjuste('restaurarTodo()','Restaurar los ajustes','Vuelve a los grupos, dificultades y objetivos de partida. No toca recetas ni menús.')+
    filaAjuste('empezarDeCero()','Empezar de cero','Borra recetas, menús, despensa e historial. Esto no se puede deshacer.');
  if(!ES_APP) h+=filaAjuste('reiniciar()','Volver al ejemplo de la demo','Recupera los datos de muestra para trastear sin miedo.');

  h+='<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function alternarApunte(){
  LOCAL.apuntar=!apunta(); guardarLocal();
  hojaAjustes(); pintar();
}
function alternarOpcion(k){
  LOCAL[k]=!LOCAL[k]; guardarLocal(); pintar(); hojaAjustes();
}
function hojaRapidos(){
  const l=DATOS.rapidos||rapidosPorDefecto();
  let h='<h2>Comidas de fuera del menú</h2>'+
        '<p class="sub">Cuando apuntáis que comisteis otra cosa, estas salen para tocar y listo. Poned las de verdad: el bocadillo del bar, el menú del día…</p>';
  l.forEach(function(x,i){
    h+='<div class="editor"><div class="editor-cab">'+
       '<input class="campo" style="margin:0" value="'+esc(x)+'" onchange="renombrarRapido('+i+',this.value)">'+
       '<button class="quitar" onclick="borrarRapido('+i+')">Quitar</button></div></div>';
  });
  h+='<div class="editor"><input class="campo" id="nr-nombre" placeholder="Por ejemplo: empanada del bar">'+
     '<button class="btn btn-1" style="margin:0" onclick="crearRapido()">Añadir</button></div>'+
     '<button class="btn btn-plano" onclick="DATOS.rapidos=rapidosPorDefecto();hojaRapidos();pintar()">Volver a la lista de partida</button>'+
     '<button class="btn btn-plano" onclick="hojaAjustes()">Volver</button>';
  abrirHoja(h);
}
function renombrarRapido(i,n){
  n=String(n||'').trim(); if(!n){hojaRapidos();return;}
  DATOS.rapidos[i]=n; hojaRapidos(); pintar();
}
function borrarRapido(i){ DATOS.rapidos.splice(i,1); hojaRapidos(); pintar(); }
function crearRapido(){
  const n=document.getElementById('nr-nombre').value.trim();
  if(!n){aviso('Escribe el nombre.');return;}
  DATOS.rapidos=DATOS.rapidos||rapidosPorDefecto();
  DATOS.rapidos.push(n); hojaRapidos(); pintar();
}
function hojaSitios(){
  let h='<h2>Sitios donde guardáis la comida</h2><p class="sub">La app aprende dónde va cada producto y lo guarda ahí solo al marcarlo comprado.</p>';
  DATOS.sitios.forEach(function(s,i){
    h+='<div class="editor"><div class="editor-cab">'+
       '<input class="campo" style="margin:0" value="'+esc(s.n)+'" onchange="renombrarSitio('+i+',this.value)">'+
       (DATOS.sitios.length>1?'<button class="quitar" onclick="borrarSitio('+i+')">Quitar</button>':'')+
       '</div><p class="pista" style="margin:0">'+s.items.length+' cosas guardadas</p></div>';
  });
  h+='<div class="editor"><input class="campo" id="ns-nombre" placeholder="Otro sitio: bodega, garaje, cesta de fruta…">'+
     '<button class="btn btn-1" style="margin:0" onclick="crearSitio()">Añadir sitio</button></div>'+
     '<button class="btn btn-plano" onclick="DATOS.sitios=datosIniciales().sitios;hojaSitios();pintar()">Volver a los cuatro de partida</button>'+
     '<button class="btn btn-plano" onclick="hojaAjustes()">Volver</button>';
  abrirHoja(h);
}
function crearSitio(){
  const n=document.getElementById('ns-nombre').value.trim();
  if(!n){aviso('Ponle nombre.');return;}
  DATOS.sitios.push({n:n,items:[]});
  hojaSitios(); pintar();
}
function borrarSitio(i){
  if(DATOS.sitios.length<2){aviso('Deja al menos uno.');return;}
  puntoDeVuelta('Sitio quitado');
  const items=DATOS.sitios[i].items||[];
  DATOS.sitios.splice(i,1);
  DATOS.sitios[0].items=DATOS.sitios[0].items.concat(items);
  hojaSitios(); pintar();
}
function renombrarSitio(i,n){
  n=String(n||'').trim(); if(n) DATOS.sitios[i].n=n;
  hojaSitios(); pintar();
}
function hojaGrupos(){
  let h='<h2>Grupos de alimentos</h2><p class="sub">Etiquetáis cada receta con ellos y así la app sabe cuánta legumbre o cuánto pescado coméis. Al renombrar uno se cambia en todas las recetas.</p>';
  DATOS.gruposDef.forEach(function(g,i){
    h+='<div class="editor"><div class="editor-cab">'+
       '<input class="campo" style="margin:0" value="'+esc(g.n)+'" onchange="renombrarGrupo('+i+',this.value)">'+
       '<button class="quitar" onclick="borrarGrupo('+i+')">Quitar</button></div><div class="colores">';
    PALETA.forEach(function(c){
      h+='<button class="color'+(g.c===c?' sel':'')+'" style="background:var(--'+c+')" onclick="colorearGrupo('+i+',\''+c+'\')" aria-label="'+c+'"></button>';
    });
    h+='</div></div>';
  });
  h+='<div class="editor"><p class="etiqueta">Nuevo grupo</p><input class="campo" id="ng-nombre" placeholder="Lácteos, fermentados, ultraprocesados…">'+
     '<button class="btn btn-1" style="margin:0" onclick="crearGrupo()">Añadir</button></div>'+
     '<button class="btn btn-plano" onclick="DATOS.gruposDef=gruposPorDefecto();hojaGrupos();pintar()">Volver a los grupos de partida</button>'+
     '<button class="btn btn-plano" onclick="hojaAjustes()">Volver</button>';
  abrirHoja(h);
}
function renombrarGrupo(i,nuevo){
  nuevo=String(nuevo||'').trim(); if(!nuevo){hojaGrupos();return;}
  const viejo=DATOS.gruposDef[i].n; if(viejo===nuevo) return;
  DATOS.gruposDef[i].n=nuevo;
  DATOS.recetas.forEach(function(r){r.grupos=(r.grupos||[]).map(function(g){return g===viejo?nuevo:g;});});
  objsTodos().forEach(function(o){o.grupos=o.grupos.map(function(g){return g===viejo?nuevo:g;});});
  guardarLocal();
  hojaGrupos(); pintar();
}
function colorearGrupo(i,c){DATOS.gruposDef[i].c=c;hojaGrupos();pintar();}
function borrarGrupo(i){
  const n=DATOS.gruposDef[i].n; DATOS.gruposDef.splice(i,1);
  DATOS.recetas.forEach(function(r){r.grupos=(r.grupos||[]).filter(function(g){return g!==n;});});
  objsTodos().forEach(function(o){o.grupos=o.grupos.filter(function(g){return g!==n;});});
  DATOS.objetivos=DATOS.objetivos.filter(function(o){return o.grupos.length;});
  LOCAL.objetivos=objsMios().filter(function(o){return o.grupos.length;});
  guardarLocal();
  hojaGrupos(); pintar(); aviso('Grupo quitado de todas las recetas.');
}
function crearGrupo(){
  const n=document.getElementById('ng-nombre').value.trim();
  if(!n){aviso('Ponle nombre.');return;}
  if(grupoDef(n)){aviso('Ya existe.');return;}
  DATOS.gruposDef.push({n:n,c:PALETA[DATOS.gruposDef.length%PALETA.length]});
  hojaGrupos(); pintar();
}
function hojaDificultades(){
  let h='<h2>Niveles de dificultad</h2><p class="sub">Sirven para encontrar plato según el tiempo que tengáis. Renombradlos como habléis en casa.</p>';
  DATOS.dificultades.forEach(function(d,i){
    h+='<div class="editor"><div class="editor-cab">'+
       '<input class="campo" style="margin:0" value="'+esc(d)+'" onchange="renombrarDif('+i+',this.value)">'+
       '<button class="quitar" onclick="borrarDif('+i+')">Quitar</button></div></div>';
  });
  h+='<div class="editor"><p class="etiqueta">Nuevo nivel</p><input class="campo" id="nd-nombre" placeholder="Por ejemplo: de diez minutos, para invitados">'+
     '<button class="btn btn-1" style="margin:0" onclick="crearDif()">Añadir</button></div>'+
     '<button class="btn btn-plano" onclick="DATOS.dificultades=dificultadesPorDefecto();hojaDificultades();pintar()">Volver a los tres de partida</button>'+
     '<button class="btn btn-plano" onclick="hojaAjustes()">Volver</button>';
  abrirHoja(h);
}
function renombrarDif(i,nuevo){
  nuevo=String(nuevo||'').trim(); if(!nuevo){hojaDificultades();return;}
  const viejo=DATOS.dificultades[i]; DATOS.dificultades[i]=nuevo;
  DATOS.recetas.forEach(function(r){if(r.esfuerzo===viejo) r.esfuerzo=nuevo;});
  hojaDificultades(); pintar();
}
function borrarDif(i){
  if(DATOS.dificultades.length<2){aviso('Deja al menos uno.');return;}
  const viejo=DATOS.dificultades.splice(i,1)[0];
  DATOS.recetas.forEach(function(r){if(r.esfuerzo===viejo) r.esfuerzo=DATOS.dificultades[0];});
  hojaDificultades(); pintar();
}
function crearDif(){
  const n=document.getElementById('nd-nombre').value.trim();
  if(!n){aviso('Ponle nombre.');return;}
  DATOS.dificultades.push(n); hojaDificultades(); pintar();
}
function restaurarTodo(){
  DATOS.gruposDef=gruposPorDefecto(); DATOS.dificultades=dificultadesPorDefecto();
  DATOS.objetivos=objetivosPorDefecto(); DATOS.variedad=30;
  cerrarHoja(); pintar(); aviso('Ajustes restaurados. Vuestras recetas y menús siguen igual.');
}
function empezarDeCero(){
  puntoDeVuelta('Vaciado todo');
  const d=datosIniciales();
  d.recetas=[]; d.act=semanaVacia(); d.prox=semanaVacia(); d.historial=[]; d.plantillas=[]; d.sensaciones=[];
  d.sitios=[{n:'Frigorífico',items:[]},{n:'Congelador',items:[]},{n:'Huerto',items:[]},{n:'Despensa',items:[]}];
  DATOS=d; cerrarHoja(); verVista('hoy'); aviso('Listo, todo vacío para empezar.');
}
function reiniciar(){
  DATOS=datosIniciales(); BUSQUEDA=''; MOVIENDO=null; VER_PASADOS=false; COMPACTA=false; FILTRO_ESF='';
  cerrarHoja(); pintar(); aviso('Datos de ejemplo recuperados.');
}
function hojaSemanaVieja(i){
  const x=DATOS.historial[i]; if(!x) return;
  let h='<h2>'+esc(x.nombre)+'</h2><p class="sub">'+x.cumplidos+' de '+(DATOS.objetivos||[]).length+' objetivos comunes · '+x.variedad+' ingredientes distintos</p>';
  Object.keys(x.plan).forEach(function(n){
    const o=objsTodos().filter(function(y){return y.nombre===n;})[0];
    const v=x.plan[n];
    const bien=o?(o.tipo==='min'?v>=o.obj:v<=o.obj):null;
    h+='<div class="editor"><div class="editor-cab"><b>'+esc(n)+'</b><span class="mini '+(bien===null?'gris':(bien?'verde':''))+'">'+v+(o?(o.tipo==='min'?' de '+o.obj:' / máx '+o.obj):'')+'</span></div></div>';
  });
  const p=DATOS.plantillas.filter(function(y){return y.nombre===x.nombre;})[0];
  if(p){
    const platos=Object.keys(p.menu).filter(function(k){return p.menu[k];})
      .map(function(k){const r=receta(p.menu[k]);return r?r.nombre:null;}).filter(Boolean);
    const unicos=platos.filter(function(v,j,a){return a.indexOf(v)===j;});
    if(unicos.length) h+='<p class="etiqueta">Qué comisteis</p><p class="sub">'+esc(unicos.join(' · '))+'</p>';
  }
  h+='<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function hojaPorQue(id){
  const o=objPorId(id); if(!o) return;
  const v=cuenta(o);
  const serie=DATOS.historial.slice(-6).map(function(x){return (x.plan&&x.plan[o.nombre])||0;}).concat([v]);
  const max=Math.max.apply(null,serie.concat([o.obj,1]));
  let g='<div class="grafica" style="height:90px">';
  serie.forEach(function(y,i){
    g+='<div class="col"><span class="vv">'+y+'</span><div class="bb'+(i===serie.length-1?' act':'')+'" style="height:'+Math.max(4,Math.round(y/max*100))+'%"></div></div>';
  });
  g+='</div>';
  abrirHoja('<h2>'+esc(o.nombre)+'</h2>'+
    '<p class="sub">'+esc(o.guia||'')+'</p>'+g+
    '<p class="etiqueta" style="margin-top:14px">De dónde sale este número</p>'+
    '<div class="texto-receta" style="max-height:none">'+esc(o.fuente||'Objetivo puesto por vosotros desde Ajustes.')+'</div>'+
    '<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>');
}
function fichaObjetivo(o,mio){
  let h='<div class="editor"><div class="editor-cab"><b>'+esc(o.nombre)+'</b>'+
       '<button class="quitar" onclick="borrarObjetivo(\''+o.id+'\')">Quitar</button></div><div class="marcas" style="margin:0 0 10px">';
    o.grupos.forEach(function(g){h+='<span class="marca" style="'+estiloGrupo(g)+'">'+esc(g)+'</span>';});
    h+='</div><div class="par" style="align-items:center">'+
       '<button class="btn '+(o.tipo==='min'?'btn-2':'btn-plano')+'" style="margin:0" onclick="tipoObjetivo(\''+o.id+'\',\'min\')">Mínimo</button>'+
       '<button class="btn '+(o.tipo==='max'?'btn-2':'btn-plano')+'" style="margin:0" onclick="tipoObjetivo(\''+o.id+'\',\'max\')">Máximo</button></div>'+
       '<div class="paso" style="margin-top:10px"><button onclick="sumarObjetivo(\''+o.id+'\',-1)">−</button><b>'+o.obj+'</b>'+
       '<button onclick="sumarObjetivo(\''+o.id+'\',1)">+</button><span class="pista" style="margin:0 0 0 10px">veces por semana</span></div>'+
       '<button class="btn btn-plano" style="margin:10px 0 0;font-size:13px;padding:10px" onclick="cambiarDueno(\''+o.id+'\')">'+
       (mio?'Pasarlo a los dos':'Hacerlo solo mío')+'</button></div>';
  return h;
}
function hojaObjetivos(){
  let h='<h2>Objetivos de la semana</h2>'+
    '<p class="sub">Cuántas veces por semana queréis que salga cada cosa, contando comidas y cenas.</p>'+
    '<p class="etiqueta">De los dos</p>';
  if(!DATOS.objetivos.length) h+='<p class="vacio-msg" style="padding:2px 0 10px">Ninguno común.</p>';
  DATOS.objetivos.forEach(function(o){ h+=fichaObjetivo(o,false); });
  h+='<p class="etiqueta">Solo míos <i class="solo-aqui">no los ve nadie más</i></p>';
  if(!objsMios().length) h+='<p class="vacio-msg" style="padding:2px 0 10px">Ninguno propio. Podéis tener objetivos distintos sin que el otro sepa cuáles.</p>';
  objsMios().forEach(function(o){ h+=fichaObjetivo(o,true); });
  h+='<div class="editor"><div class="editor-cab"><b>Variedad</b></div>'+
     '<div class="paso"><button onclick="sumarVariedad(-5)">−</button><b>'+DATOS.variedad+'</b>'+
     '<button onclick="sumarVariedad(5)">+</button><span class="pista" style="margin:0 0 0 10px">ingredientes</span></div></div>'+
     '<button class="btn btn-1" onclick="hojaCatalogo()">Añadir de la lista recomendada</button>'+
     '<button class="btn btn-plano" onclick="hojaNuevoObjetivo()">Crear uno nuevo</button>'+
     '<button class="btn btn-plano" onclick="DATOS.objetivos=objetivosPorDefecto();DATOS.variedad=30;hojaObjetivos();pintar()">Valores de la AESAN en los comunes</button>'+
     '<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function trasEditar(id){ if(esMio(id)) guardarLocal(); hojaObjetivos(); pintar(); }
function sumarObjetivo(id,d){const o=objPorId(id);if(!o)return;o.obj=Math.max(0,Math.min(14,o.obj+d));trasEditar(id);}
function tipoObjetivo(id,t){const o=objPorId(id);if(!o)return;o.tipo=t;trasEditar(id);}
function borrarObjetivo(id){
  if(esMio(id)){ LOCAL.objetivos=objsMios().filter(function(x){return x.id!==id;}); guardarLocal(); }
  else DATOS.objetivos=DATOS.objetivos.filter(function(x){return x.id!==id;});
  hojaObjetivos(); pintar();
}
function cambiarDueno(id){
  const o=objPorId(id); if(!o) return;
  if(esMio(id)){
    LOCAL.objetivos=objsMios().filter(function(x){return x.id!==id;});
    DATOS.objetivos.push(o);
  } else {
    DATOS.objetivos=DATOS.objetivos.filter(function(x){return x.id!==id;});
    LOCAL.objetivos=objsMios().concat([o]);
  }
  guardarLocal(); hojaObjetivos(); pintar();
}
function sumarVariedad(d){DATOS.variedad=Math.max(5,Math.min(60,DATOS.variedad+d));hojaObjetivos();pintar();}
function hojaCatalogo(){
  const puestos=objsTodos().map(function(o){return o.nombre;});
  const libres=catalogoObjetivos().filter(function(o){return puestos.indexOf(o.nombre)===-1;});
  let h='<h2>Lista recomendada</h2><p class="sub">Sacados de la AESAN y de EAT-Lancet. Añadid los que os interesen.</p>';
  if(!libres.length) h+='<p class="vacio-msg">Ya los tenéis todos.</p>';
  libres.forEach(function(o){
    h+='<button class="receta" onclick="anadirDelCatalogo(\''+o.id+'\')"><h3>'+esc(o.nombre)+'</h3>'+
       '<p>'+(o.tipo==='min'?'mínimo ':'máximo ')+o.obj+' por semana · '+esc(o.guia)+'</p></button>';
  });
  h+='<button class="btn btn-plano" onclick="hojaObjetivos()">Volver</button>';
  abrirHoja(h);
}
function anadirDelCatalogo(id){
  const o=catalogoObjetivos().filter(function(x){return x.id===id;})[0];
  if(!o) return;
  hojaDueno(JSON.parse(JSON.stringify(o)));
}
function hojaDueno(o){
  abrirHoja('<h2>'+esc(o.nombre)+'</h2><p class="sub">¿Es un objetivo de los dos o solo tuyo?</p>'+
    '<button class="btn btn-1" onclick="guardarObjetivo(false)">De los dos</button>'+
    '<button class="btn btn-2" onclick="guardarObjetivo(true)">Solo mío</button>'+
    '<p class="pista">Si es tuyo se guarda en este móvil y la otra persona solo verá que tienes objetivos propios, no cuáles.</p>');
  PENDIENTE_OBJ=o;
}
let PENDIENTE_OBJ=null;
function guardarObjetivo(mio){
  const o=PENDIENTE_OBJ; PENDIENTE_OBJ=null; if(!o) return;
  o.id=(mio?'m':'c')+Date.now()+Math.floor(Math.random()*99);
  if(mio){ LOCAL.objetivos=objsMios().concat([o]); guardarLocal(); }
  else DATOS.objetivos.push(o);
  cerrarHoja(); hojaObjetivos(); pintar(); aviso(o.nombre+' añadido.');
}
function hojaNuevoObjetivo(){
  let h='<h2>Nuevo objetivo</h2><p class="etiqueta">Nombre</p><input class="campo" id="ob-nombre" placeholder="Cenas de verdura, fermentados…">'+
        '<p class="etiqueta">Qué cuenta</p><div class="filtros">';
  DATOS.gruposDef.forEach(function(g){h+='<button class="filtro" data-og="'+esc(g.n)+'" onclick="this.classList.toggle(\'sel\')">'+esc(g.n)+'</button>';});
  h+='</div><p class="etiqueta">Tipo</p><div class="par" style="margin-bottom:14px">'+
     '<button class="btn btn-2" data-otipo="min" style="margin:0" onclick="unicoEn(this)">Mínimo</button>'+
     '<button class="btn btn-plano" data-otipo="max" style="margin:0" onclick="unicoEn(this)">Máximo</button></div>'+
     '<p class="etiqueta">Veces por semana</p><input class="campo" id="ob-num" inputmode="numeric" value="3">'+
     '<button class="btn btn-1" onclick="crearObjetivo()">Crear</button>'+
     '<button class="btn btn-plano" onclick="hojaObjetivos()">Volver</button>';
  abrirHoja(h);
}
function unicoEn(el){
  Array.prototype.forEach.call(el.parentNode.children,function(b){b.classList.remove('sel');b.classList.remove('btn-2');b.classList.add('btn-plano');});
  el.classList.add('sel'); el.classList.remove('btn-plano'); el.classList.add('btn-2');
}
function crearObjetivo(){
  const nombre=document.getElementById('ob-nombre').value.trim();
  const grupos=Array.prototype.map.call(document.querySelectorAll('[data-og].sel'),function(b){return b.getAttribute('data-og');});
  const tipoEl=document.querySelector('[data-otipo].sel');
  const num=Math.max(0,Math.min(14,parseInt(document.getElementById('ob-num').value,10)||0));
  if(!grupos.length){aviso('Elige al menos un grupo.');return;}
  hojaDueno({id:'o'+Date.now(),nombre:nombre||grupos.join(' y '),grupos:grupos,
    tipo:tipoEl?tipoEl.getAttribute('data-otipo'):'min',obj:num,guia:'Objetivo puesto por vosotros.'});
}

/* ---------- hojas de plato y receta ---------- */
let FOCO_PREVIO=null;
function abrirHoja(html){
  const yaAbierta=!!document.querySelector('.hoja');
  if(!yaAbierta) FOCO_PREVIO=document.activeElement;
  document.getElementById('capa').innerHTML=
    '<div class="fondo-modal" onclick="if(event.target===this)cerrarHoja()">'+
    '<div class="hoja" role="dialog" aria-modal="true" tabindex="-1"><div class="asa" aria-hidden="true"></div>'+html+'</div></div>';
  document.body.style.overflow='hidden';
  const hoja=document.querySelector('.hoja');
  if(hoja){ hoja.focus(); hoja.scrollTop=0; }
}
function cerrarHoja(){
  document.getElementById('capa').innerHTML='';
  document.body.style.overflow='';
  if(FOCO_PREVIO && FOCO_PREVIO.focus){ try{ FOCO_PREVIO.focus(); }catch(e){} }
  FOCO_PREVIO=null;
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape' && document.querySelector('.hoja')) cerrarHoja();
});

function hojaElegir(dia,comida,destino){
  const ant=anteriorConPlato(dia,comida);
  const dst=destino||'';
  let h='<h2>'+(dst==='segundo'?'Segundo plato':(dst.indexOf('aparte:')===0?'Plato para '+dst.split(':')[1]:comida+' del '+dia.toLowerCase()))+'</h2>'+
        (dst?'<p class="sub">'+comida+' del '+dia.toLowerCase()+'</p>':'');
  if(ant){
    const ra=receta(ant.id);
    h+='<p class="etiqueta">Sobras</p><div class="chips">'+
       '<button class="chip" onclick="repetirSobras(\''+dia+'\',\''+comida+'\')">'+esc(ra.nombre)+(ant.doble?' · hicisteis doble':'')+'</button></div>';
  }
  if(LOCAL.dificultad){
    h+='<div class="filtros">';
    [''].concat(DATOS.dificultades).forEach(function(e){
      h+='<button class="filtro'+(FILTRO_ESF===e?' sel':'')+'" onclick="FILTRO_ESF=\''+e+'\';hojaElegir(\''+dia+'\',\''+comida+'\')">'+(e||'Todas')+'</button>';
    });
    h+='</div>';
  } else FILTRO_ESF='';
  const conLoQueHay=sugerencias().filter(function(x){return x.total>1 && x.tengo/x.total>=0.75;}).slice(0,3);
  if(conLoQueHay.length && !FILTRO_ESF){
    h+='<p class="etiqueta">Con lo que tenéis en casa</p><div class="chips">';
    conLoQueHay.forEach(function(x){
      h+='<button class="chip n" onclick="cerrarHoja();ponerEnMenu(\''+dia+'\',\''+comida+'\',\''+x.r.id+'\',\''+dst+'\')">'+esc(x.r.nombre)+
         (x.faltan.length?' · falta '+esc(x.faltan[0]):'')+'</button>';
    });
    h+='</div>';
  }
  const lista=DATOS.recetas.filter(function(r){return !FILTRO_ESF||r.esfuerzo===FILTRO_ESF;})
    .sort(function(a,b){return a.nombre.localeCompare(b.nombre,'es');});
  h+='<div style="max-height:42vh;overflow-y:auto;margin-bottom:14px">';
  if(!lista.length) h+='<p class="vacio-msg">Ninguna con ese filtro.</p>';
  lista.forEach(function(r){
    h+='<button class="receta" onclick="cerrarHoja();ponerEnMenu(\''+dia+'\',\''+comida+'\',\''+r.id+'\',\''+dst+'\')"><h3>'+esc(r.nombre)+'</h3><p>'+hace(r.ultimaTs)+'</p>'+marcas(r,true)+'</button>';
  });
  h+='</div><button class="btn btn-1" onclick="hojaReceta(null,{dia:\''+dia+'\',comida:\''+comida+'\'})">Crear receta nueva</button>'+
     '<button class="btn btn-plano" onclick="cerrarHoja()">Cerrar</button>';
  abrirHoja(h);
}
function repetirSobras(dia,comida){
  const ant=anteriorConPlato(dia,comida); if(!ant) return;
  const k=dia+'|'+comida;
  S().menu[k]=ant.id; S().sobras[k]=true; S().cocinas[k]='';
  cerrarHoja(); pintar(); aviso('Marcado como sobras.');
}
function quitarPlato(dia,comida){
  const r=receta(S().menu[dia+'|'+comida]);
  puntoDeVuelta('Quitado '+(r?r.nombre:'el plato'));
  ponerEnMenu(dia,comida,'');
}
function ponerEnMenu(dia,comida,id,destino){
  const k=dia+'|'+comida;
  if(destino==='segundo'){ S().segundo[k]=id; pintar(); const a2=avisoTolerancia(id); if(a2) aviso(a2); return; }
  if(destino && destino.indexOf('aparte:')===0){
    S().aparte[k]={p:destino.split(':')[1], id:id};
    pintar(); aviso('Apuntado el plato aparte.'); return;
  }
  S().menu[k]=id; S().sobras[k]=false; delReg(k);
  if(!id){S().cocinas[k]='';S().fijos[k]=false;S().guarnicion[k]=false;S().doble[k]=false;S().segundo[k]='';S().aparte[k]=null;}
  pintar();
  const a=avisoTolerancia(id);
  if(a) aviso(a);
}
function avisoTolerancia(id){
  if(!id || !apunta()) return '';
  const c=tolerancia(id); if(!c) return '';
  const total=(c.bien||0)+(c.regular||0)+(c.mal||0);
  const flojo=(c.regular||0)+(c.mal||0);
  if(total>=2 && flojo/total>=0.5){
    const r=receta(id);
    return 'Ojo: te sentó regular o mal '+flojo+' de '+total+' veces'+(r?' con '+r.nombre.toLowerCase():'')+'.';
  }
  return '';
}
function cocineros(){ const y=yo(); return y?[y].concat(PERSONAS.filter(function(p){return p!==y;})):PERSONAS.slice(); }
function ponerCocinero(dia,comida,quien){S().cocinas[dia+'|'+comida]=quien;hojaPlato(dia,comida,S().menu[dia+'|'+comida]);pintar();}
function alternar(campo,dia,comida,msg){
  const k=dia+'|'+comida;
  S()[campo][k]=!S()[campo][k];
  hojaPlato(dia,comida,S().menu[k]); pintar();
  if(msg&&S()[campo][k]) aviso(msg);
}
function alternarFijo(dia,comida){
  const k=dia+'|'+comida;
  S().fijos[k]=!S().fijos[k];
  hojaPlato(dia,comida,S().menu[k]); pintar();
  aviso(S().fijos[k]?'Fija todos los '+dia.toLowerCase()+'.':'Ya no está fijada.');
}
function hojaPlato(dia,comida,id){
  const r=receta(id); if(!r) return;
  const k=dia+'|'+comida;
  const quien=S().cocinas[k]||'';
  let sel='<p class="etiqueta">Quién cocina</p><div class="par" style="margin-bottom:16px">';
  cocineros().concat(['Nadie']).forEach(function(n){
    const v=(n==='Nadie')?'':n;
    sel+='<button class="btn '+(quien===v?'btn-2':'btn-plano')+'" style="margin:0" onclick="ponerCocinero(\''+dia+'\',\''+comida+'\',\''+v+'\')">'+n+'</button>';
  });
  sel+='</div>';
  abrirHoja(
    '<h2>'+esc(r.nombre)+'</h2>'+
    '<p class="sub">'+comida+' del '+dia.toLowerCase()+(S().sobras[k]?' · sobras':'')+(S().fijos[k]?' · fija':'')+'</p>'+
    marcas(r)+lineaTolerancia(r.id)+'<div style="height:16px"></div>'+sel+
    '<div class="par" style="margin-bottom:14px">'+
    '<button class="btn '+(S().guarnicion[k]?'btn-2':'btn-plano')+'" style="margin:0" onclick="alternar(\'guarnicion\',\''+dia+'\',\''+comida+'\',\'Cuenta para el objetivo de verdura.\')">Con verdura</button>'+
    '<button class="btn '+(S().doble[k]?'btn-2':'btn-plano')+'" style="margin:0" onclick="alternar(\'doble\',\''+dia+'\',\''+comida+'\',\'Te ofrezco las sobras en el siguiente hueco.\')">Cocinar de más</button></div>'+
    (r.texto?'<div class="texto-receta">'+esc(r.texto)+'</div>':'')+
    '<button class="btn btn-1" onclick="modoCocina(\''+r.id+'\')">Modo cocina</button>'+
    (r.url?'<button class="btn btn-plano" onclick="abrirEnlace(\''+attr(r.url)+'\')">Abrir la receta</button>':'')+
    '<button class="btn btn-4" onclick="alternarFijo(\''+dia+'\',\''+comida+'\')">'+(S().fijos[k]?'Dejar de repetir cada semana':'Fijar todos los '+dia.toLowerCase())+'</button>'+
    (function(){
      const s2=receta(S().segundo&&S().segundo[k]);
      const ap=S().aparte&&S().aparte[k];
      const ra=ap?receta(ap.id):null;
      return '<p class="etiqueta">Además</p>'+
        '<button class="btn btn-plano" onclick="cerrarHoja();hojaElegir(\''+dia+'\',\''+comida+'\',\'segundo\')">'+
        (s2?'Segundo: '+esc(s2.nombre)+' · cambiar':'Añadir un segundo plato')+'</button>'+
        (s2?'<button class="btn btn-plano" onclick="quitarSegundo(\''+dia+'\',\''+comida+'\')">Quitar el segundo</button>':'')+
        '<button class="btn btn-plano" onclick="hojaAparte(\''+dia+'\',\''+comida+'\')">'+
        (ap&&ra?esc(ap.p)+' come '+esc(ra.nombre)+' · cambiar':'Alguien come otro plato')+'</button>'+
        (ap&&ra?'<button class="btn btn-plano" onclick="quitarAparte(\''+dia+'\',\''+comida+'\')">Quitar el plato aparte</button>':'');
    })()+
    '<div class="par"><button class="btn btn-3" onclick="cerrarHoja();MOVIENDO={dia:\''+dia+'\',comida:\''+comida+'\'};pintar()">Mover</button>'+
    '<button class="btn btn-plano" onclick="cerrarHoja();hojaElegir(\''+dia+'\',\''+comida+'\')">Cambiar</button></div>'+
    '<button class="btn btn-peligro" onclick="cerrarHoja();quitarPlato(\''+dia+'\',\''+comida+'\')">Quitar del menú</button>'
  );
}
function hojaAparte(dia,comida){
  const k=dia+'|'+comida;
  let h='<h2>Otro plato</h2><p class="sub">Para cuando uno de los dos come algo distinto ese día.</p>';
  cocineros().forEach(function(p){
    h+='<button class="btn btn-plano" onclick="cerrarHoja();hojaElegir(\''+dia+'\',\''+comida+'\',\'aparte:'+p+'\')">Elegir plato para '+p+'</button>';
  });
  h+='<button class="btn btn-plano" onclick="hojaPlato(\''+dia+'\',\''+comida+'\',S().menu[\''+k+'\'])">Volver</button>';
  abrirHoja(h);
}
function quitarSegundo(dia,comida){
  const k=dia+'|'+comida; S().segundo[k]=''; cerrarHoja(); pintar(); aviso('Segundo quitado.');
}
function quitarAparte(dia,comida){
  const k=dia+'|'+comida; S().aparte[k]=null; cerrarHoja(); pintar(); aviso('Plato aparte quitado.');
}
function modoCocina(id){
  const r=receta(id); if(!r) return;
  try{ if(navigator.wakeLock&&navigator.wakeLock.request) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
  abrirHoja('<h2 style="font-size:34px">'+esc(r.nombre)+'</h2>'+
    (r.ingredientes.length?'<p class="etiqueta" style="font-size:16px">Ingredientes</p><p style="font-size:19px;line-height:1.6;margin:0 0 18px">'+esc(r.ingredientes.join(' · '))+'</p>':'')+
    (r.texto?'<p class="etiqueta" style="font-size:16px">Paso a paso</p><div style="font-size:21px;line-height:1.7;white-space:pre-wrap;margin-bottom:18px">'+esc(r.texto)+'</div>':
             '<p class="vacio-msg">Esta receta no tiene los pasos guardados.</p>')+
    (r.url?'<button class="btn btn-1" onclick="abrirEnlace(\''+attr(r.url)+'\')">Abrir la receta completa</button>':'')+
    '<p class="sub">La pantalla intentará no apagarse mientras esta ventana esté abierta.</p>'+
    '<button class="btn btn-plano" onclick="cerrarHoja()">Salir del modo cocina</button>');
}
function lineaTolerancia(id){
  const t=apunta()?tolerancia(id):null;
  if(!t) return '';
  return '<p class="pista" style="margin:8px 0 0">A ti: '+t.bien+' bien · '+t.regular+' regular · '+t.mal+' mal</p>';
}
function abrirEnlace(u){window.open(u,'_blank');}

function hojaReceta(id,destino){
  const r=id?receta(id):null;
  const suyos=r?(r.grupos||[]):[];
  let gr='<p class="etiqueta">Grupos</p><p class="pista">Marca todos los que lleve.</p><div class="filtros">';
  DATOS.gruposDef.forEach(function(g){
    gr+='<button class="filtro'+(suyos.indexOf(g.n)!==-1?' sel':'')+'" data-rg="'+esc(g.n)+'" onclick="this.classList.toggle(\'sel\')">'+esc(g.n)+'</button>';
  });
  gr+='</div><p class="etiqueta">Dificultad</p><div class="filtros">';
  DATOS.dificultades.forEach(function(e){
    gr+='<button class="filtro'+((r?r.esfuerzo:DATOS.dificultades[0])===e?' sel':'')+'" data-re="'+esc(e)+'" onclick="soloUno(this)">'+esc(e)+'</button>';
  });
  gr+='</div>';
  abrirHoja(
    '<h2>'+(r?'Editar receta':'Nueva receta')+'</h2>'+(r?lineaTolerancia(r.id):'')+
    '<input class="campo" id="rec-nombre" placeholder="Nombre del plato" value="'+(r?esc(r.nombre):'')+'">'+
    '<input class="campo" id="rec-principal" placeholder="Ingrediente protagonista (opcional)" value="'+(r&&r.principal?esc(r.principal):'')+'">'+
    gr+
    '<input class="campo" id="rec-url" placeholder="Enlace, opcional" value="'+(r&&r.url?esc(r.url):'')+'">'+
    '<textarea class="campo" id="rec-ing" placeholder="Ingredientes separados por comas, opcional">'+(r?esc(r.ingredientes.join(', ')):'')+'</textarea>'+
    '<textarea class="campo" id="rec-texto" placeholder="Receta entera, opcional">'+(r&&r.texto?esc(r.texto):'')+'</textarea>'+
    (r?'<button class="btn btn-peligro" onclick="cerrarHoja();borrarReceta(\''+r.id+'\')">Borrar receta</button>':'')+
    '<div class="pie-hoja">'+
    '<button class="btn btn-1" onclick="guardarRecetaUI(\''+(id||'')+'\','+(destino?JSON.stringify(destino).replace(/"/g,'&quot;'):'null')+')">Guardar</button>'+
    '<button class="btn btn-plano" onclick="cerrarHoja()">Cancelar</button></div>'
  );
  setTimeout(function(){const n=document.getElementById('rec-nombre'); if(n&&!r) n.focus();},60);
}
function soloUno(el){
  Array.prototype.forEach.call(el.parentNode.children,function(b){b.classList.remove('sel');});
  el.classList.add('sel');
}
function guardarRecetaUI(id,destino){
  const nombre=document.getElementById('rec-nombre').value.trim();
  if(!nombre){aviso('Solo el nombre es obligatorio, pero ese sí.');return;}
  const grupos=Array.prototype.map.call(document.querySelectorAll('[data-rg].sel'),function(b){return b.getAttribute('data-rg');});
  const esfEl=document.querySelector('[data-re].sel');
  const vals={
    nombre:nombre,
    ingredientes:document.getElementById('rec-ing').value.split(/[,\n]/).map(function(s){return s.trim();}).filter(Boolean),
    principal:document.getElementById('rec-principal').value.trim(),
    grupos:grupos,
    esfuerzo:esfEl?esfEl.getAttribute('data-re'):DATOS.dificultades[0],
    url:document.getElementById('rec-url').value.trim(),
    texto:document.getElementById('rec-texto').value.trim()
  };
  cerrarHoja();
  let r=id?receta(id):null;
  if(r) Object.assign(r,vals);
  else {r=Object.assign({id:'r'+Date.now(),veces:0,ultimaTs:0},vals); DATOS.recetas.push(r);}
  if(destino){S().menu[destino.dia+'|'+destino.comida]=r.id;S().sobras[destino.dia+'|'+destino.comida]=false;}
  pintar();
}
function borrarReceta(id){
  const rr=receta(id); puntoDeVuelta('Borrada '+(rr?rr.nombre:'la receta'));
  DATOS.recetas=DATOS.recetas.filter(function(r){return r.id!==id;});
  Object.keys(S().menu).forEach(function(k){
    if(S().menu[k]===id){S().menu[k]='';S().cocinas[k]='';S().fijos[k]=false;S().sobras[k]=false;S().guarnicion[k]=false;S().doble[k]=false;delReg(k);}
  });
  pintar();
}

cargarGuardado();
comprobarSemana();
pintar();
bajar(true);
if(!LOCAL.quien) hojaQuien(true);
setInterval(function(){ if(!document.hidden) bajar(); }, 20000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) bajar(); else actualizarGlobo(); });
window.addEventListener('online', function(){ bajar(); subir(); });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
